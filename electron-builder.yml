appId: com.oxespace.app
productName: OXESpace
directories:
  output: dist
# Update feed for electron-updater (and where `electron-builder --publish`
# uploads). The app reads GitHub Releases for `latest.yml` + the installer.
publish:
  provider: github
  owner: propagno
  repo: oxespace
files:
  - out/**/*
  - package.json
  - from: electron/main/db/migrations
    to: out/main/migrations
  # Dead weight: transformers.js download cache (MiniLM / e5-small leftovers).
  # The shipped model is resources/models → multilingual-e5-base only.
  - "!**/node_modules/@xenova/transformers/.cache/**"
# NOTE: pruning the ONNX Runtime prebuilds for other platforms is done by
# scripts/slim-pack-deps.mjs (which both `dist:win` and `dist:linux` run before
# electron-builder), NOT by a filter here. A `files` filter cannot vary by
# target, and the previous hardcoded "drop linux/darwin" rules would have
# stripped the very binaries a Linux build needs — killing semantic search in
# the packaged app with no visible error.
#
# extraResources is declared per platform and each block is COMPLETE (the shared
# entries are repeated rather than inherited from a top-level list), so the
# build never depends on how electron-builder merges platform overrides.
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/node-pty/**/*
  # Semantic search worker loads the ONNX runtime native binding through
  # @xenova/transformers; native .node files cannot be loaded from inside the
  # asar archive, so they must stay unpacked on disk.
  # (.cache is already excluded via files filters + scripts/slim-pack-deps.mjs)
  - node_modules/@xenova/transformers/**/*
  - node_modules/onnxruntime-node/**/*
  - node_modules/sharp/**/*
  # CodeGraph parses with web-tree-sitter (wasm). The parse worker reads these
  # as real files, which is impossible from inside the asar — keep them unpacked.
  - node_modules/web-tree-sitter/**/*
  - node_modules/tree-sitter-wasms/**/*
  # Find in Files runs the ripgrep binary. The JS wrapper (@vscode/ripgrep)
  # resolves rg from the platform package (@vscode/ripgrep-<os>-<arch>); an .exe
  # cannot execute from inside the asar, so keep both unpacked. search.service.ts
  # rewrites the app.asar path to app.asar.unpacked at runtime.
  - node_modules/@vscode/ripgrep/**/*
  - node_modules/@vscode/ripgrep-*/**/*
win:
  icon: resources/icon.ico
  # Produce channel-specific manifests (for example beta.yml) so prerelease
  # builds cannot replace the stable latest.yml update feed.
  generateUpdatesFilesForAllChannels: true
  target:
    - target: nsis
      arch:
        - x64
  artifactName: OXESpace-${version}-${arch}.${ext}
  extraResources:
    - from: resources/icon.ico
      to: icon.ico
    # Internal MCP bridge spawned by agent CLIs at runtime — must be on disk
    # next to the packaged app so .mcp.json's `args: ["<absolute path>"]`
    # resolves whether the user runs the installed build or a portable copy.
    - from: resources/mcp-bridge
      to: mcp-bridge
    # OXEVoice engine — bundled whisper.cpp CLI spawned at runtime by
    # voice.service.ts. Lands at <resourcesPath>/whisper/whisper-cli.exe.
    # Windows-only for now; voice.service.ts reports the engine unavailable and
    # the feature hides itself where the binary is absent.
    - from: resources/whisper/win-x64
      to: whisper
    # Semantic search model (multilingual-e5-base) bundled so it loads OFFLINE —
    # no huggingface.co download at runtime (fails on locked-down networks). Lands
    # at <resourcesPath>/models/Xenova/multilingual-e5-base/. Populated at build
    # time by `npm run prepare:model` (scripts/fetch-semantic-model.mjs).
    - from: resources/models
      to: models
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
linux:
  # Linux cannot read the multi-resolution .ico — main/index.ts selects this PNG
  # at runtime too, otherwise the window falls back to Electron's default icon.
  icon: resources/icon.png
  category: Development
  synopsis: An open source, AI-native workspace and terminal
  maintainer: OXESpace contributors <propagno@users.noreply.github.com>
  generateUpdatesFilesForAllChannels: true
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  # StartupWMClass lets the desktop match the running window to this entry, so
  # the taskbar shows the real name/icon — and native notifications
  # (ipc/notifications.ipc.ts) are attributed to OXESpace rather than "Electron".
  desktop:
    Name: OXESpace
    StartupWMClass: OXESpace
    Categories: Development;IDE;
  extraResources:
    - from: resources/icon.png
      to: icon.png
    - from: resources/mcp-bridge
      to: mcp-bridge
    - from: resources/models
      to: models
appImage:
  # electron-builder renders ${arch} as "x86_64" for AppImage, while the
  # cross-platform release contract uses "x64". Keep the public name stable.
  artifactName: OXESpace-${version}-x64.${ext}
deb:
  # Debian's canonical architecture name is amd64 (not Electron's x64).
  artifactName: OXESpace-${version}-amd64.${ext}
  # libnotify is what Electron's Notification API talks to; without it agent
  # notifications silently no-op. The rest are the Electron runtime baseline.
  # Alternatives, not a choice between them: Ubuntu 24.04's 64-bit time_t
  # transition renamed these three, so a single name installs on exactly one
  # generation of Ubuntu and fails on the other. dpkg picks the first that
  # resolves, which keeps 22.04 (what CI builds on) and 24.04 both working.
  depends:
    - libnotify4
    - libnss3
    - libatk-bridge2.0-0t64 | libatk-bridge2.0-0
    - libgtk-3-0t64 | libgtk-3-0
    - libgbm1
    - libasound2t64 | libasound2
    - libxshmfence1
