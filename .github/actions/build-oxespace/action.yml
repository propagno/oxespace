name: Build or Restore OXESpace Bundle
description: Build renderer/main bundles with bundle budgets and import guards, or download a same-OS prebuilt out/ artifact.

inputs:
  mode:
    description: build (compile out/ locally) or download (restore same-OS out/ artifact)
    required: false
    default: "build"
  platform-label:
    description: Platform label matching the current runner OS (linux-x64 or windows-x64)
    required: true
  artifact-name:
    description: Override artifact name (defaults to app-build-<platform-label>)
    required: false
    default: ""
  rebuild-native-node:
    description: Run npm run rebuild:native:node before building
    required: false
    default: "true"
  check-bundle-imports:
    description: Verify the compiled bundles do not import devDependencies
    required: false
    default: "true"
  check-windows-notices:
    description: Run npm run notices:check on Windows
    required: false
    default: "false"
  upload-build:
    description: Upload out/ as a short-lived same-OS build artifact for downstream jobs
    required: false
    default: "false"
  upload-sourcemaps:
    description: Upload out/main/**/*.map as main-sourcemaps-<platform-label> (90 days)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Check third-party notices and bundled licenses (Windows)
      if: inputs.mode == 'build' && inputs.check-windows-notices == 'true' && runner.os == 'Windows'
      shell: bash
      run: npm run notices:check

    - name: Build renderer and main process (bundle budgets)
      if: inputs.mode == 'build'
      shell: bash
      env:
        REBUILD_NODE: ${{ inputs.rebuild-native-node }}
        CHECK_IMPORTS: ${{ inputs.check-bundle-imports }}
      run: |
        set -euo pipefail
        if [ "$REBUILD_NODE" = "true" ]; then
          npm run rebuild:native:node
        fi
        npm run build
        if [ "$CHECK_IMPORTS" = "true" ]; then
          node scripts/check-bundle-imports.mjs
        fi

    - name: Upload same-OS build output
      if: inputs.mode == 'build' && inputs.upload-build == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name || format('app-build-{0}', inputs.platform-label) }}
        if-no-files-found: error
        retention-days: 1
        path: out/

    - name: Upload main-process source maps
      if: inputs.mode == 'build' && inputs.upload-sourcemaps == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: main-sourcemaps-${{ inputs.platform-label }}
        if-no-files-found: error
        retention-days: 90
        path: out/main/**/*.map

    - name: Download same-OS build output
      if: inputs.mode == 'download'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact-name || format('app-build-{0}', inputs.platform-label) }}
        path: out
