name: Setup OXESpace
description: Set up Node.js 22, optional Linux Electron/Xvfb deps, npm dependencies (--ignore-scripts), Electron binary cache, and native modules.

inputs:
  node-version:
    description: Node.js major or exact version
    required: false
    default: "22"
  npm-cache:
    description: Enable actions/setup-node npm cache (disable for untrusted cross-ref runs)
    required: false
    default: "true"
  cache-dependency-path:
    description: Optional cache-dependency-path override for actions/setup-node
    required: false
    default: ""
  install-deps:
    description: Run npm ci --ignore-scripts
    required: false
    default: "true"
  linux-deps:
    description: Install Linux Xvfb/GTK/NSS/ALSA system dependencies when running on Linux
    required: false
    default: "false"
  extra-apt-packages:
    description: Optional extra space-separated apt packages to install on Linux (e.g. x11-utils)
    required: false
    default: ""
  electron:
    description: Restore the Electron download cache and run npm rebuild electron
    required: false
    default: "false"
  electron-cache-only:
    description: Restore the Electron download cache without running npm rebuild electron
    required: false
    default: "false"
  native:
    description: Native module build target (none, node, electron, both)
    required: false
    default: "none"
  verify-native:
    description: Run npm run verify:native after npm run fix:native
    required: false
    default: "true"
  scrub-live-env:
    description: Fail if live OXESpace/AI_MEMORY environment variables reached the runner
    required: false
    default: "false"

outputs:
  electron-version:
    description: Pinned Electron version read from node_modules/electron/package.json
    value: ${{ steps.electron.outputs.version }}

runs:
  using: composite
  steps:
    - name: Node.js (with npm cache)
      if: inputs.npm-cache == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Node.js (without npm cache)
      if: inputs.npm-cache != 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    - name: Linux system dependencies
      if: inputs.linux-deps == 'true' && runner.os == 'Linux'
      shell: bash
      env:
        EXTRA_APT: ${{ inputs.extra-apt-packages }}
      run: |
        set -euo pipefail
        # Ubuntu 24.04 renamed libasound2 (64-bit time_t); 22.04 has only the old name.
        alsa=libasound2
        if dpkg -s libasound2t64 >/dev/null 2>&1 || apt-cache show libasound2t64 >/dev/null 2>&1; then
          alsa=libasound2t64
        fi
        req=(xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 "$alsa" libxshmfence1)
        extra=()
        if [ -n "$EXTRA_APT" ]; then
          read -r -a extra <<< "$EXTRA_APT"
        fi
        apt_opts=(-o APT::Sandbox::User=root -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 -o Acquire::Retries=1)
        if ! dpkg -s "${req[@]}" libnotify4 "${extra[@]}" >/dev/null 2>&1; then
          if getent ahostsv4 archive.ubuntu.com >/dev/null 2>&1 \
            && timeout 180 sudo apt-get "${apt_opts[@]}" update \
            && timeout 300 sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends "${req[@]}" libnotify4 "${extra[@]}"; then
            :
          elif dpkg -s "${req[@]}" "${extra[@]}" >/dev/null 2>&1; then
            echo "::warning::apt mirror unreachable; required Electron/Xvfb packages (${req[*]} ${extra[*]}) are already preinstalled"
          else
            exit 1
          fi
        fi

    - name: Install dependencies without lifecycle scripts
      if: inputs.install-deps == 'true'
      shell: bash
      run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund

    - name: Electron version
      id: electron
      if: inputs.electron == 'true' || inputs.electron-cache-only == 'true'
      shell: bash
      run: echo "version=$(node -p "require('electron/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache the Electron download
      if: inputs.electron == 'true' || inputs.electron-cache-only == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/electron/Cache' || '~/.cache/electron' }}
        key: electron-${{ runner.os }}-${{ steps.electron.outputs.version }}

    - name: Install the pinned Electron runtime
      if: inputs.electron == 'true'
      shell: bash
      run: npm rebuild electron

    - name: Node runtime fingerprint for native cache (Linux)
      id: node-native-key
      if: (inputs.native == 'node' || inputs.native == 'both') && runner.os == 'Linux'
      shell: bash
      run: echo "runtime=$(node -p "process.version + '-abi' + process.versions.modules")" >> "$GITHUB_OUTPUT"

    - name: Cache node-pty native build (Linux)
      id: node-pty-cache
      if: (inputs.native == 'node' || inputs.native == 'both') && runner.os == 'Linux'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules/node-pty/build/Release
        key: node-pty-${{ runner.os }}-${{ runner.arch }}-${{ steps.node-native-key.outputs.runtime }}-${{ hashFiles('package-lock.json') }}

    - name: Build native modules for Node
      if: inputs.native == 'node' || inputs.native == 'both'
      shell: bash
      env:
        PTY_CACHE_HIT: ${{ steps.node-pty-cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" = "Linux" ] && [ "$PTY_CACHE_HIT" = "true" ] && [ -f node_modules/node-pty/build/Release/pty.node ]; then
          echo "Restored node-pty build/Release from cache; rebuilding remaining Node native modules only."
          npm rebuild better-sqlite3
        else
          npm run rebuild:native:node
        fi

    - name: Prepare native modules for Electron
      if: inputs.native == 'electron' || inputs.native == 'both'
      shell: bash
      env:
        VERIFY_NATIVE: ${{ inputs.verify-native }}
      run: |
        set -euo pipefail
        npm run fix:native
        if [ "$VERIFY_NATIVE" = "true" ]; then
          npm run verify:native
        fi

    - name: Assert no live OXESpace env reaches the run
      if: inputs.scrub-live-env == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if env | cut -d= -f1 | grep -Ei '^(OXESPACE_(MCP_|EXECUTION_|AGENT_HOOK_|WORKSPACE_ID$|MEMORY_RUN(_ID)?$|PANE_BRIDGE$)|AI_MEMORY_)'; then
          echo "::error::live OXESpace variables are set on the runner"
          exit 1
        fi
