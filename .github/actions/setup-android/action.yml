name: Setup Android Toolchain
description: Set up Temurin Java 21, pinned Android SDK cmdline-tools, optional Gradle cache, and optional KVM permissions for Android emulator runs.

inputs:
  java-version:
    description: Temurin JDK version
    required: false
    default: "21"
  cmdline-tools-version:
    description: Android SDK cmdline-tools version
    required: false
    default: "16111833"
  packages:
    description: Space-separated Android SDK packages to install
    required: false
    default: "platform-tools platforms;android-37.0"
  skip-java:
    description: Skip JDK setup (e.g. for signing-only jobs using apksigner)
    required: false
    default: "false"
  skip-gradle:
    description: Skip gradle/actions/setup-gradle
    required: false
    default: "false"
  gradle-cache-read-only:
    description: Run Gradle cache in read-only mode (for untrusted or release builds)
    required: false
    default: "false"
  enable-kvm:
    description: Configure /dev/kvm permissions on Linux runners for the Android emulator
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Java ${{ inputs.java-version }}
      if: inputs.skip-java != 'true'
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        cmdline-tools-version: ${{ inputs.cmdline-tools-version }}
        log-accepted-android-sdk-licenses: false
        packages: ${{ inputs.packages }}

    - name: Gradle
      if: inputs.skip-gradle != 'true'
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-read-only: ${{ inputs.gradle-cache-read-only == 'true' }}

    - name: Enable KVM
      if: inputs.enable-kvm == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
