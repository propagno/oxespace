name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation and why it is hard today, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do instead today?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Code (terminals)
        - Thread
        - Changes / review
        - GitHub
        - MCP connectors
        - Memory / search
        - Web Preview
        - Settings / appearance
        - Packaging / updates
        - Other
