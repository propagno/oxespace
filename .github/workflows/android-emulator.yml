name: Android emulator
# The app's instrumented tests (Keystore, pinned TLS on Conscrypt, the WSS session) on an Android emulator. Heavy,
# so it runs on request only: Actions › Android emulator › Run workflow, choosing the branch.

on:
  workflow_dispatch:
    inputs:
      api-level:
        description: Android API level of the emulator
        required: false
        default: "36"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumented:
    name: Instrumented tests (API ${{ inputs.api-level }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: "16111833" # cmdline-tools 23.0
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-37.0

      # From API 37 the SDK names packages with a minor version: platforms;android-37.0 and
      # system-images;android-37.0;google_apis;x86_64. There is no "android-37", which the emulator runner would
      # ask for given "37" and then fail with no emulator. So 37 and up become "<n>.0" unless a minor is given. A
      # level with no google_apis x86_64 image is skipped with a notice instead of a red job.
      - name: Resolve the API level's SDK names
        id: sdk
        env:
          LEVEL: ${{ inputs.api-level }}
        run: |
          set -euo pipefail
          if ! [[ "$LEVEL" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::api-level must be a number such as 36, 37 or 37.1, got: $LEVEL"
            exit 1
          fi
          if [[ "$LEVEL" =~ ^[0-9]+$ ]] && (( LEVEL >= 37 )); then LEVEL="$LEVEL.0"; fi
          image="system-images;android-$LEVEL;google_apis;x86_64"
          if sdkmanager --list 2>/dev/null | grep -qF "$image "; then
            echo "level=$LEVEL" >> "$GITHUB_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Emulator API level $LEVEL ($image)"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Emulator skipped::$image is not offered by the SDK, so API $LEVEL cannot run here. Nothing was tested."
            echo "### Emulator skipped: no \`$image\` in the SDK" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.sdk.outputs.available == 'true'

      # The emulator needs KVM; GitHub's Linux runners have it once the device is readable.
      - name: Enable KVM
        if: steps.sdk.outputs.available == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and its tests
        if: steps.sdk.outputs.available == 'true'
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Run instrumented tests
        if: steps.sdk.outputs.available == 'true'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ steps.sdk.outputs.level }}
          target: google_apis
          arch: x86_64
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: mobile/android
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-instrumented-reports
          path: |
            mobile/android/app/build/reports/androidTests/
            mobile/android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
