name: Android emulator
# The app's instrumented tests (Keystore, pinned TLS on Conscrypt, the WSS session) on an Android emulator. Heavy,
# so it runs on request only: Actions › Android emulator › Run workflow, choosing the branch.

on:
  workflow_dispatch:
    inputs:
      api-level:
        description: Android API level of the emulator
        required: false
        default: "36"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumented:
    name: Instrumented tests (API ${{ inputs.api-level }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: "16111833" # cmdline-tools 23.0
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-37.0

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The emulator needs KVM; GitHub's Linux runners have it once the device is readable.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and its tests
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Run instrumented tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ inputs.api-level }}
          target: google_apis
          arch: x86_64
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: mobile/android
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-instrumented-reports
          path: |
            mobile/android/app/build/reports/androidTests/
            mobile/android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
