name: Android emulator
# The app's instrumented tests (Keystore, pinned TLS on Conscrypt, the WSS session) on an Android emulator. Heavy,
# so it runs on request only: Actions › Android emulator › Run workflow, choosing the branch.

on:
  workflow_dispatch:
    inputs:
      api-level:
        description: Android API level of the emulator
        required: false
        default: "36"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumented:
    name: Instrumented tests (API ${{ inputs.api-level }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: "16111833" # cmdline-tools 23.0
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-37.0

      # From API 37 the SDK names packages with a minor version: platforms;android-37.0 and
      # system-images;android-37.0;google_apis;x86_64. There is no "android-37", which the emulator runner would
      # ask for given "37" and then fail with no emulator. So 37 and up become "<n>.0" unless a minor is given. A
      # level with no google_apis x86_64 image is skipped with a notice instead of a red job.
      - name: Resolve the API level's SDK names
        id: sdk
        env:
          LEVEL: ${{ inputs.api-level }}
        run: |
          set -euo pipefail
          if ! [[ "$LEVEL" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::api-level must be a number such as 36, 37 or 37.1, got: $LEVEL"
            exit 1
          fi
          if [[ "$LEVEL" =~ ^[0-9]+$ ]] && (( LEVEL >= 37 )); then LEVEL="$LEVEL.0"; fi
          image="system-images;android-$LEVEL;google_apis;x86_64"
          # The whole listing first: `sdkmanager --list | grep -q` under pipefail reads a match as a failure, since
          # grep -q exits at the first match and sdkmanager then dies of SIGPIPE. cmdline-tools 23 (the Android CLI)
          # lists packages as system-images/android-37.0/google_apis/x86_64, in colour; older ones use ";". Both are
          # read, colours stripped; installing still takes the ";" name.
          listing=$(sdkmanager --list 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' || true)
          if ! grep -qE '^ *system-images[;/]' <<< "$listing"; then
            echo "::error::sdkmanager --list listed no system image at all, so the level could not be checked"
            exit 1
          fi
          if grep -qE "^ *system-images[;/]android-${LEVEL//./\\.}[;/]google_apis[;/]x86_64[[:space:]]" <<< "$listing"; then
            echo "level=$LEVEL" >> "$GITHUB_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
            # API 37's image did not finish booting in 600 s on 2 cores (adb stayed "device offline", run
            # 41905637065): from 37 on, the emulator gets the runner's 4 cores, 4 GB and 15 minutes.
            if [[ "${LEVEL%%.*}" -ge 37 ]]; then
              { echo "cores=4"; echo "ram=4096M"; echo "boot-timeout=900"; } >> "$GITHUB_OUTPUT"
            else
              { echo "cores=2"; echo "ram="; echo "boot-timeout=600"; } >> "$GITHUB_OUTPUT"
            fi
            echo "Emulator API level $LEVEL ($image)"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Emulator skipped::$image is not offered by the SDK, so API $LEVEL cannot run here. Nothing was tested."
            echo "### Emulator skipped: no \`$image\` in the SDK" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.sdk.outputs.available == 'true'

      # The emulator needs KVM; GitHub's Linux runners have it once the device is readable.
      - name: Enable KVM
        if: steps.sdk.outputs.available == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and its tests
        if: steps.sdk.outputs.available == 'true'
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Run instrumented tests
        if: steps.sdk.outputs.available == 'true'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ steps.sdk.outputs.level }}
          target: google_apis
          arch: x86_64
          cores: ${{ steps.sdk.outputs.cores }}
          ram-size: ${{ steps.sdk.outputs.ram }}
          emulator-boot-timeout: ${{ steps.sdk.outputs.boot-timeout }}
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: mobile/android
          # sys.boot_completed can come before the package service: on API 37 the APK install then failed with
          # "Can't find service: package" (run 41942234679). Wait up to 5 minutes for it first. The runner runs each
          # script line on its own, so the wait is one line.
          script: |
            sh -c 'for i in $(seq 1 60); do adb shell cmd package list packages >/dev/null 2>&1 && exit 0; sleep 5; done; echo "::error::the package service never came up"; exit 1'
            ./gradlew --no-daemon connectedDebugAndroidTest

      # Gradle's test engine reports BUILD SUCCESSFUL even when it could not install the APK and ran nothing (run
      # 41942234679: "0 tests"). So the results decide: at least one test ran, and no failure other than a test
      # that skipped itself (AssumptionViolatedException, e.g. ReleaseSmokeTest on a debug build).
      - name: Require instrumented test results
        if: steps.sdk.outputs.available == 'true'
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(mobile/android/app/build/outputs/androidTest-results/connected/**/TEST-*.xml)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::no instrumented test result: nothing ran on the emulator"; exit 1; fi
          tests=$(grep -ho '<testsuite [^>]*' "${files[@]}" | grep -o ' tests="[0-9]*"' | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          failures=$(grep -ho '<failure[^>]*>[^<]\{0,120\}' "${files[@]}" | grep -vc 'AssumptionViolatedException' || true)
          echo "instrumented tests: $tests, real failures: $failures" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$tests" -eq 0 ]; then echo "::error::0 instrumented tests ran"; exit 1; fi
          if [ "$failures" -gt 0 ]; then echo "::error::$failures instrumented test(s) failed"; exit 1; fi

      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-instrumented-reports
          path: |
            mobile/android/app/build/reports/androidTests/
            mobile/android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
