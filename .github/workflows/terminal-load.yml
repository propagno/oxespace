# OXE-411: what the terminal costs under load, lever by lever (shared/terminal-levers.ts):
# e2e/perf/terminal-load-breakdown.spec.ts on the built app with real PTYs, 5 arms (base, H, M, I, H+M+I) x 5 rounds,
# the load on screen and in a hidden workspace; echo, Ctrl K, workspace switch, main:loop, and CPU and memory per
# process type. One job per OS; CI only. Runs on pushes to ci/terminal-load-* (and by hand); never in the smoke run.
name: Terminal load breakdown (OXE-411)
run-name: Terminal load breakdown (OXE-411) · ${{ github.ref_name }}
on:
  push:
    branches: ["ci/terminal-load-*"]
  workflow_dispatch:

concurrency:
  group: terminal-load-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  breakdown:
    name: Breakdown (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-2022
          - label: linux-x64
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          alsa=libasound2
          if dpkg -s libasound2t64 >/dev/null 2>&1; then alsa=libasound2t64; fi
          req=(xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 "$alsa" libxshmfence1)
          apt_opts=(-o APT::Sandbox::User=root -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 -o Acquire::Retries=1)
          if ! dpkg -s "${req[@]}" >/dev/null 2>&1; then
            if getent ahostsv4 archive.ubuntu.com >/dev/null 2>&1 && timeout 180 sudo apt-get "${apt_opts[@]}" update && timeout 300 sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends "${req[@]}"; then
              :
            else
              exit 1
            fi
          fi

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Install the pinned Electron runtime
        run: npm rebuild electron

      - name: Build renderer and main process
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run rebuild:native:node
          npm run build

      - name: Prepare and verify native modules for Electron
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run fix:native
          npm run verify:native

      - name: CA-1 to CA-3, lever by lever
        shell: bash
        env:
          OXESPACE_BREAKDOWN_RESULTS: ${{ github.workspace }}/results/terminal-load
        run: |
          set -o pipefail
          mkdir -p results/terminal-load
          if [[ "$RUNNER_OS" == Linux ]]; then
            bash scripts/run-with-xvfb.sh npx playwright test --config playwright.tools.config.ts e2e/perf/terminal-load-breakdown.spec.ts --reporter=line 2>&1 | tee results/terminal-load/log.txt
          else
            npx playwright test --config playwright.tools.config.ts e2e/perf/terminal-load-breakdown.spec.ts --reporter=line 2>&1 | tee results/terminal-load/log.txt
          fi

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Terminal load breakdown (${{ matrix.label }})"
            echo
            if [[ -f results/terminal-load/summary.md ]]; then cat results/terminal-load/summary.md; else grep -a '[BREAKDOWN]|passed|failed' results/terminal-load/log.txt || echo "no results"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terminal-load-${{ matrix.label }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            results/terminal-load/
            test-results/
