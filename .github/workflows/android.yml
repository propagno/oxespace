name: Android
# Companion Android app in mobile/android:
# - Default (push/PR/dispatch): lint, unit tests, Paparazzi golden verification, and debug APK build.
# - On-demand emulator (workflow_dispatch with run_emulator=true): instrumented tests (Keystore, TLS, WSS) on KVM emulator.

on:
  push:
    branches: [main]
    paths:
      - "mobile/android/**"
      - "shared/remote/**"
      - "shared/locales/*/mobile.json"
      - "src/design/tokens/**"
      - "src/design/targets/brd-07.json"
      - "scripts/android/**"
      - "shared/approval-rules.ts"
      - "shared/reserved-names.ts"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/android/**"
      - "shared/remote/**"
      - "shared/locales/*/mobile.json"
      - "src/design/tokens/**"
      - "src/design/targets/brd-07.json"
      - "scripts/android/**"
      - "shared/approval-rules.ts"
      - "shared/reserved-names.ts"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      run_emulator:
        description: Run instrumented tests on an Android emulator instead of lint/unit/Paparazzi
        required: false
        default: false
        type: boolean
      api_level:
        description: Android API level of the emulator (used when run_emulator=true)
        required: false
        default: "36"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.run_emulator && format('emulator-{0}', inputs.api_level || '36') || 'build' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || inputs.run_emulator == true }}

permissions:
  contents: read

jobs:
  build:
    name: Lint, unit tests and build
    if: ${{ !inputs.run_emulator && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Android toolchain
        uses: ./.github/actions/setup-android

      # verifyPaparazziDebug runs every unit test and compares each screen with its golden in app/src/test/snapshots.
      - name: Lint, unit tests, screenshots and debug build
        run: ./gradlew --no-daemon lint verifyPaparazziDebug :protocol:test assembleDebug

      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            mobile/android/app/build/reports/
            mobile/android/app/build/test-results/
            mobile/android/protocol/build/reports/
            mobile/android/protocol/build/test-results/
            mobile/android/app/build/paparazzi/failures/
          if-no-files-found: ignore
          retention-days: 14

      - name: Screens that changed
        if: always()
        working-directory: .
        shell: bash
        env:
          REPORTS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
        run: |
          dir=mobile/android/app/build/paparazzi/failures
          count=$(find "$dir" -name '*.png' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" = 0 ]; then echo "### Phone screens: none differs from its golden" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          {
            echo "### Phone screens that changed: $count"
            echo "The images (golden, new, delta) are in the **android-reports** artifact, folder \`app/build/paparazzi/failures\`: $REPORTS_URL"
            find "$dir" -name '*.png' -printf '- `%f`\n' | sort | head -60
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Phone screens::$count screen(s) differ from their goldens; see the run summary"

  instrumented:
    name: Instrumented tests (API ${{ inputs.api_level || '36' }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_emulator == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK and Android SDK
        uses: ./.github/actions/setup-android
        with:
          skip-gradle: "true"

      # From API 37 the SDK names packages with a minor version (e.g. android-37.0).
      - name: Resolve the API level's SDK names
        id: sdk
        shell: bash
        env:
          LEVEL: ${{ inputs.api_level || '36' }}
        run: |
          set -euo pipefail
          if ! [[ "$LEVEL" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::api_level must be a number such as 36, 37 or 37.1, got: $LEVEL"
            exit 1
          fi
          if [[ "$LEVEL" =~ ^[0-9]+$ ]] && (( LEVEL >= 37 )); then LEVEL="$LEVEL.0"; fi
          image="system-images;android-$LEVEL;google_apis;x86_64"
          listing=$(sdkmanager --list 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' || true)
          if ! grep -qE '^ *system-images[;/]' <<< "$listing"; then
            echo "::error::sdkmanager --list listed no system image at all, so the level could not be checked"
            exit 1
          fi
          if grep -qE "^ *system-images[;/]android-${LEVEL//./\\.}[;/]google_apis[;/]x86_64[[:space:]]" <<< "$listing"; then
            echo "level=$LEVEL" >> "$GITHUB_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
            if [[ "${LEVEL%%.*}" -ge 37 ]]; then
              { echo "cores=4"; echo "ram=4096M"; echo "boot-timeout=900"; } >> "$GITHUB_OUTPUT"
            else
              { echo "cores=2"; echo "ram="; echo "boot-timeout=600"; } >> "$GITHUB_OUTPUT"
            fi
            echo "Emulator API level $LEVEL ($image)"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Emulator skipped::$image is not offered by the SDK, so API $LEVEL cannot run here. Nothing was tested."
            echo "### Emulator skipped: no \`$image\` in the SDK" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.sdk.outputs.available == 'true'

      - name: Enable KVM
        if: steps.sdk.outputs.available == 'true'
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and its tests
        if: steps.sdk.outputs.available == 'true'
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Run instrumented tests
        if: steps.sdk.outputs.available == 'true'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ steps.sdk.outputs.level }}
          target: google_apis
          arch: x86_64
          cores: ${{ steps.sdk.outputs.cores }}
          ram-size: ${{ steps.sdk.outputs.ram }}
          emulator-boot-timeout: ${{ steps.sdk.outputs.boot-timeout }}
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: mobile/android
          script: |
            sh -c 'ok=0; for i in $(seq 1 60); do if adb shell pm path android 2>/dev/null | grep -q "^package:"; then ok=$((ok+1)); [ "$ok" -ge 2 ] && echo "package service up" && exit 0; sleep 15; else ok=0; sleep 5; fi; done; echo "::error::the package service never came up"; exit 1'
            ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Require instrumented test results
        if: steps.sdk.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(mobile/android/app/build/outputs/androidTest-results/connected/**/TEST-*.xml)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::no instrumented test result: nothing ran on the emulator"; exit 1; fi
          tests=$(grep -ho '<testsuite [^>]*' "${files[@]}" | grep -o ' tests="[0-9]*"' | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          failures=$(grep -ho '<failure[^>]*>[^<]\{0,120\}' "${files[@]}" | grep -vc 'AssumptionViolatedException' || true)
          echo "instrumented tests: $tests, real failures: $failures" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$tests" -eq 0 ]; then echo "::error::0 instrumented tests ran"; exit 1; fi
          if [ "$failures" -gt 0 ]; then echo "::error::$failures instrumented test(s) failed"; exit 1; fi

      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-instrumented-reports
          path: |
            mobile/android/app/build/reports/androidTests/
            mobile/android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
