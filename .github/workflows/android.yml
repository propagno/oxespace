name: Android
# The companion app in mobile/android: lint, unit tests and a debug build on every change to it or to what it is
# generated from (the remote protocol, the design tokens and the locale catalogs).

on:
  push:
    branches: [main]
    paths:
      - "mobile/android/**"
      - "shared/remote/**"
      - "shared/locales/*/mobile.json"
      - "src/design/tokens/**"
      - "scripts/android/**"
      - "shared/approval-rules.ts"
      - "shared/reserved-names.ts"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    # Only the locale catalogs the app is generated from (shared/locales/<lang>/mobile.json), not every
    # desktop string; and the generator itself, which the push list above also gets.
    paths:
      - "mobile/android/**"
      - "shared/remote/**"
      - "shared/locales/*/mobile.json"
      - "src/design/tokens/**"
      - "scripts/android/**"
      - "shared/approval-rules.ts"
      - "shared/reserved-names.ts"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Lint, unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # The runner's SDK may lack the platform the app compiles against, and older cmdline-tools can't read the
      # repository that publishes it, so both are installed here instead of trusting the image.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: "16111833" # cmdline-tools 23.0
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-37.0

      # Checks the wrapper jar against Gradle's published checksums and caches dependencies.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Lint, unit tests and debug build
        run: ./gradlew --no-daemon lint testDebugUnitTest :protocol:test assembleDebug

      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            mobile/android/app/build/reports/
            mobile/android/app/build/test-results/
            mobile/android/protocol/build/reports/
            mobile/android/protocol/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
