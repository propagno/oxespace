name: Android
# The companion app in mobile/android: lint, unit tests and a debug build on every change to it or to what it is
# generated from (the remote protocol, the design tokens and the locale catalogs).

on:
  push:
    branches: [main]
    paths:
      - "mobile/android/**"
      - "shared/remote/**"
      - "shared/locales/*/mobile.json"
      - "src/design/tokens/**"
      - "scripts/android/**"
      - "shared/approval-rules.ts"
      - "shared/reserved-names.ts"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    # Only the locale catalogs the app is generated from (shared/locales/<lang>/mobile.json), not every
    # desktop string; and the generator itself, which the push list above also gets.
    paths:
      - "mobile/android/**"
      - "shared/remote/**"
      - "shared/locales/*/mobile.json"
      - "src/design/tokens/**"
      - "scripts/android/**"
      - "shared/approval-rules.ts"
      - "shared/reserved-names.ts"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Lint, unit tests and build
    # A draft is not ready for review: frozen tests stay red there by design (test/*-frozen). It runs once the PR is
    # marked ready.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # The runner's SDK may lack the platform the app compiles against, and older cmdline-tools can't read the
      # repository that publishes it, so both are installed here instead of trusting the image.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: "16111833" # cmdline-tools 23.0
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-37.0

      # Checks the wrapper jar against Gradle's published checksums and caches dependencies.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # verifyPaparazziDebug runs every unit test and compares each screen with its golden in app/src/test/snapshots.
      - name: Lint, unit tests, screenshots and debug build
        run: ./gradlew --no-daemon recordPaparazziDebug

      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            mobile/android/app/build/reports/
            mobile/android/app/build/test-results/
            mobile/android/protocol/build/reports/
            mobile/android/protocol/build/test-results/
            mobile/android/app/build/paparazzi/failures/
            mobile/android/app/src/test/snapshots/images/
          if-no-files-found: ignore
          retention-days: 14

      # The phone screens that differ from their goldens, named in the run summary next to the report holding the
      # images (app/build/paparazzi/failures: the delta of each screen).
      - name: Screens that changed
        if: always()
        working-directory: .
        shell: bash
        env:
          REPORTS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
        run: |
          dir=mobile/android/app/build/paparazzi/failures
          count=$(find "$dir" -name '*.png' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" = 0 ]; then echo "### Phone screens: none differs from its golden" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          {
            echo "### Phone screens that changed: $count"
            echo "The images (golden, new, delta) are in the **android-reports** artifact, folder \`app/build/paparazzi/failures\`: $REPORTS_URL"
            find "$dir" -name '*.png' -printf '- `%f`\n' | sort | head -60
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Phone screens::$count screen(s) differ from their goldens; see the run summary"
