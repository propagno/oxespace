name: Merge train

# The merge train (S0.2): nobody merges by hand. A PR labelled `na-fila` is brought up to date with main,
# waits for a green CI run on that exact head, and is merged with a merge commit; then the next one.
# A PR that conflicts, is a draft, has changes requested, fails CI or waits too long leaves the queue with a
# `merge-train:` comment saying why. The logic is scripts/merge-train.mjs (unit-tested in
# tests/unit/merge-train.test.ts); this file only runs it. See docs/RELEASE_PIPELINE.md#merge-train.
#
# GITHUB_TOKEN caveat: a branch update or a merge made with this token starts no other workflow. So the
# train dispatches ci.yml (and the PR's other dispatchable checks) on a branch it updated, and ci.yml on main
# after each merge. Those dispatches are why this workflow needs `actions: write`.

on:
  # pull_request_target, not pull_request: the workflow and the script always come from main, never from the
  # PR being merged, and nothing from the PR is checked out or run.
  pull_request_target:
    types: [labeled]
  workflow_run:
    workflows: ["CI and Release", "Accessibility scan (axe)", "Memory compatibility"]
    types: [completed]
  # The safety net: a run the events above missed (a slow CI, a wake-up dispatch that failed) is picked up here.
  # A run the train dispatched wakes it through workflow_dispatch instead (ci.yml, job wake-merge-train).
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      timeout_minutes:
        description: Minutes a PR may wait for CI on its head before it leaves the queue
        required: false
        default: "60"
        type: string
      wait_for_run:
        description: A run to wait for before the step (set by ci.yml's wake-up job, which is still part of that run)
        required: false
        default: ""
        type: string

# One train: runs never overlap, and a run that started always finishes.
concurrency:
  group: merge-train
  cancel-in-progress: false

permissions: {}

jobs:
  train:
    name: Merge train step
    # Only the train's label starts a run from a pull request event.
    if: ${{ github.event_name != 'pull_request_target' || github.event.label.name == 'na-fila' }}
    runs-on: ubuntu-24.04
    # update-branch and merge, labels and comments, and dispatching CI; checks are only read.
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/merge-train.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # ci.yml's last job dispatches the train while that run is still in progress, and a car whose CI is still
      # running only waits. So the step starts once the run that woke it has completed (5 minutes at most).
      - name: Wait for the run that woke the train
        if: ${{ inputs.wait_for_run != '' && inputs.wait_for_run != null }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.wait_for_run }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::wait_for_run must be a run id, got: $RUN_ID"; exit 1; }
          for _ in $(seq 1 30); do
            status=$(gh run view "$RUN_ID" --json status --jq .status || echo unknown)
            if [ "$status" = completed ]; then echo "run $RUN_ID completed"; exit 0; fi
            sleep 10
          done
          echo "::warning::run $RUN_ID had not completed after 5 minutes; driving the queue anyway"
      - name: Drive the queue one step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_TRAIN_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes || vars.MERGE_TRAIN_TIMEOUT_MINUTES || '60' }}
          # Hold every car but a fix-main one while main has no green completed CI run (scripts/merge-train.mjs,
          # mainHealth). Off unless the repository variable is "true": main can be red for a known, tracked reason.
          MERGE_TRAIN_HOLD_WHEN_MAIN_RED: ${{ vars.MERGE_TRAIN_HOLD_WHEN_MAIN_RED || 'false' }}
        run: node scripts/merge-train.mjs
