# Release performance gate (OXE-105, 1.5.2 onwards): the previous two releases and the candidate measured on the SAME
# runner, in the same job, interleaved, so the table compares like with like. Per OS one job checks out v1.5.0 (A),
# v1.5.1 (B) and the candidate (C), builds and packages each (electron-builder --dir, nothing published), overlays the
# CURRENT benchmark harness of this commit onto each ref's e2e/ (old app code is never edited; a selector an old ref
# lacks gives "n/a" for that metric), then samples ABC CBA ABC… for `rounds` rounds per ref. A round runs, per ref, the
# boot probe (1 warm-up launch + 3 measured, round value = their median) and one pass of perf-benchmark,
# memory-footprint and perceived-perf against the packaged binary.
# perf-gate/summarize.mjs prints per OS: metric, median per ref, Δ candidate − v1.5.1 with its 95% bootstrap CI, and
# a verdict (REGRESSES only when the CI lies entirely above zero, improves when entirely below, else within noise).
# The table is in the run summary and in the perf-gate-* artifacts. From the brand session's boot A/B harness
# (ci/perf-ab-m2, run 43593316336); replaces the per-ref, per-runner perf-gate.yml of ci/perf-baseline.
# A release: dispatch with candidate = the release branch or tag. Before this file is on main, push the commit to a
# ci/perf-gate-* branch to run it with the defaults.
name: Performance gate
run-name: Performance gate · v1.5.0 · v1.5.1 · ${{ inputs.candidate || 'main' }} · ${{ github.ref_name }}

on:
  push:
    branches: ["ci/perf-gate-*"]
  workflow_dispatch:
    inputs:
      candidate:
        description: Candidate ref (branch, tag or SHA) compared with v1.5.1
        required: false
        default: main
        type: string
      rounds:
        description: Interleaved rounds per ref (3-15)
        required: false
        default: "7"
        type: string

concurrency:
  group: perf-gate-${{ github.ref }}-${{ inputs.candidate || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Gate (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-2022
            flag: --win
          - label: linux-x64
            os: ubuntu-22.04
            flag: --linux
    env:
      REF_A: v1.5.0
      REF_B: v1.5.1
      REF_C: ${{ inputs.candidate || 'main' }}
      ROUNDS: ${{ inputs.rounds || '7' }}
      GATE_LAUNCHES: "4"
    defaults:
      run:
        shell: bash
    steps:
      - name: Inputs
        run: |
          set -euo pipefail
          if ! [[ "$ROUNDS" =~ ^[0-9]+$ ]] || (( ROUNDS < 3 || ROUNDS > 15 )); then echo "::error::rounds must be 3-15, got $ROUNDS"; exit 1; fi
          if ! [[ "$REF_C" =~ ^[A-Za-z0-9._/-]{1,100}$ ]] || [[ "$REF_C" == *..* || "$REF_C" == -* ]]; then echo "::error::bad candidate ref"; exit 1; fi

      - name: Harness (this commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - name: A = v1.5.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF_A }}
          path: A
          persist-credentials: false
      - name: B = v1.5.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF_B }}
          path: B
          persist-credentials: false
      - name: C = candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF_C }}
          path: C
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            A/package-lock.json
            B/package-lock.json
            C/package-lock.json

      - name: Cache the Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/electron/Cache' || '~/.cache/electron' }}
          key: electron-gate-${{ runner.os }}-${{ hashFiles('A/package-lock.json', 'B/package-lock.json', 'C/package-lock.json') }}

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          alsa=libasound2
          if dpkg -s libasound2t64 >/dev/null 2>&1; then alsa=libasound2t64; fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 "$alsa" libxshmfence1 libnotify4

      - name: No live OXESpace env reaches the run
        run: |
          if env | cut -d= -f1 | grep -Ei '^(OXESPACE_|AI_MEMORY_)'; then echo "::error::OXESPACE_/AI_MEMORY_ variables are set on the runner"; exit 1; fi

      - name: Build, package and overlay the harness on each ref
        run: |
          set -euo pipefail
          mkdir -p results/rounds
          : > sides.env
          heads='['
          for side in A B C; do
            ref_var="REF_$side"; ref="${!ref_var}"
            echo "::group::$side = $ref"
            cd "$GITHUB_WORKSPACE/$side"
            npm ci --ignore-scripts
            npm rebuild electron
            npm run rebuild:native:node
            npm run build 2>&1 | tee "$GITHUB_WORKSPACE/results/$side-build.log"
            npm run fix:native
            npm run verify:native
            node "$GITHUB_WORKSPACE/harness/perf-gate/entry-size.mjs" . > "$GITHUB_WORKSPACE/results/$side-entry.json"
            cat "$GITHUB_WORKSPACE/results/$side-entry.json"
            npx electron-builder ${{ matrix.flag }} --dir --config.npmRebuild=false --publish never
            src="$(ls -d dist/*-unpacked | head -1)"
            dest="$RUNNER_TEMP/oxespace-gate-$side"
            rm -rf "$dest"; cp -a "$src" "$dest"
            if [[ "$RUNNER_OS" == Windows ]]; then exe="$(ls "$dest"/OXESpace*.exe | head -1)"; else exe="$(find "$dest" -maxdepth 1 -type f -perm -u+x -iname 'oxespace*' -print -quit)"; fi
            test -n "$exe" || { echo "::error::$side: no packaged executable"; exit 1; }
            # Playwright's _electron.launch needs --inspect: only this throwaway copy turns that fuse back on.
            npx --no-install @electron/fuses write --app "$exe" EnableNodeCliInspectArguments=on
            node scripts/check-fuses.mjs --app "$exe" --test-copy-of "$src/$(basename "$exe")"
            rm -rf dist
            # Single-quoted: `source` would read the backslashes of a Windows path (D:\a\_temp) as escapes.
            printf "EXE_%s='%s'\n" "$side" "$exe" >> "$GITHUB_WORKSPACE/sides.env"
            # The current harness over the ref's e2e/ (only test files; the app is the ref's own build above).
            for f in perf-benchmark.spec.ts perceived-perf.spec.ts memory-footprint.spec.ts helpers/input-timer.ts helpers/perf-launch.ts helpers/modes.ts helpers/panels.ts helpers/thread-fixtures.ts; do
              mkdir -p "e2e/$(dirname "$f")"; cp "$GITHUB_WORKSPACE/harness/e2e/$f" "e2e/$f"
            done
            cp "$GITHUB_WORKSPACE/harness/perf-gate/boot-probe.spec.ts" e2e/perf-gate-boot.spec.ts
            git status --short | tee "$GITHUB_WORKSPACE/results/$side-overlay.txt"
            heads+="$( [ "$side" = A ] || echo ,){\"side\":\"$side\",\"ref\":\"$ref\",\"sha\":\"$(git rev-parse HEAD)\"}"
            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
          done
          echo "$heads]" > results/heads.json
          cat results/heads.json sides.env
          df -h . || true

      - name: Sample interleaved (ABC CBA), ${{ env.ROUNDS }} rounds per ref
        env:
          # One perceived-perf launch per round, no screenshot launch, no confirmation rounds, no budgets: measure only.
          OXESPACE_PERF_LAUNCHES: "1"
          OXESPACE_PERF_SHOTS: "0"
          OXESPACE_PERF_CONFIRM: "0"
        run: |
          set +e -uo pipefail
          source sides.env
          skip='boot \+ workspace create|workspace transition:|repository: Files|boot: window interactive|memory: main process|idle memory cost|windows baselines'
          run() {
            if [[ "$RUNNER_OS" == Linux ]]; then bash scripts/run-with-xvfb.sh npx playwright test --config playwright.tools.config.ts "$@" --reporter=line
            else npx playwright test --config playwright.tools.config.ts "$@" --reporter=line; fi
          }
          sample() {
            local side=$1 round=$2 exe_var="EXE_$1" start
            start=$(date +%s)
            ( cd "$side" && export OXESPACE_PACKAGED_EXECUTABLE="${!exe_var}" GATE_SIDE="$side" GATE_ROUND="$round"
              run perf-gate-boot.spec.ts > "$GITHUB_WORKSPACE/results/rounds/$side-r$round-boot.log" 2>&1
              run perf-benchmark.spec.ts memory-footprint.spec.ts perceived-perf.spec.ts --grep-invert "$skip" > "$GITHUB_WORKSPACE/results/rounds/$side-r$round-bench.log" 2>&1 )
            echo "round $round $side: $(grep -ac '\[GATE-BOOT\].*warmup=0' "results/rounds/$side-r$round-boot.log") boots, $(grep -ac '\[RESULT\]' "results/rounds/$side-r$round-bench.log") results, $(( $(date +%s) - start )) s" | tee -a results/samples.txt
          }
          for r in $(seq 1 "$ROUNDS"); do
            if (( r % 2 )); then order="A B C"; else order="C B A"; fi
            for side in $order; do sample "$side" "$r"; done
          done
          exit 0

      - name: Table
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node harness/perf-gate/summarize.mjs results "${{ matrix.label }}" --json results/perf-gate.json | tee results/perf-gate.md
          cat results/perf-gate.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: perf-gate-${{ matrix.label }}
          retention-days: 90
          path: results/

  table:
    needs: gate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: perf-gate-*-x64
          path: perf-results
      - name: One table for both OS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p perf-gate-table
          {
            echo "## Performance gate (OXE-105): v1.5.0 × v1.5.1 × ${REF_C}, same runner, interleaved"
            echo
            for os in windows-x64 linux-x64; do
              if [ -f "perf-results/perf-gate-$os/perf-gate.md" ]; then cat "perf-results/perf-gate-$os/perf-gate.md"; else echo "### $os"; echo; echo "(no results)"; fi
              echo
            done
          } > perf-gate-table/perf-gate.md
          cat perf-gate-table/perf-gate.md >> "$GITHUB_STEP_SUMMARY"
        env:
          REF_C: ${{ inputs.candidate || 'main' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-gate-table
          retention-days: 90
          path: perf-gate-table/
