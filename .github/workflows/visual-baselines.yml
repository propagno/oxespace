name: Visual baselines
run-name: Visual baselines · ${{ inputs.platform || 'linux' }} · ${{ inputs.branch || github.ref_name }}

# Generates e2e/visual/__screenshots__/<platform> (linux or win32) for review. Never publishes anything. By default
# it never commits: download the artifact, look at the images, then commit them by explicit path.
# With `commit_to_branch` (a test/visual-baselines-* branch), a green run also commits that platform's images to it,
# from GitHub's side, so nobody has to push megabytes of images from a slow connection. The images are still
# reviewed in the PR someone opens from that branch. See e2e/visual/LINUX-BASELINES.md for the procedure.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Optional override — leave empty to use "Use workflow from"
        required: false
        type: string
      platform:
        description: Which baselines to generate
        required: false
        default: linux
        type: choice
        options: [linux, windows]
      commit_to_branch:
        description: Optional. On a green run, commit this platform's images to this branch (test/visual-baselines-* only; created from the tested commit, or added to)
        required: false
        type: string

permissions:
  contents: read

jobs:
  baselines:
    name: Generate and verify ${{ inputs.platform || 'linux' }} visual baselines
    runs-on: ${{ inputs.platform == 'windows' && 'windows-2022' || 'ubuntu-22.04' }}
    defaults:
      run:
        shell: bash
    env:
      # Windows draws without a virtual display; Linux needs Xvfb.
      RUN: ${{ inputs.platform != 'windows' && 'bash scripts/run-with-xvfb.sh' || '' }}
      SHOTS: ${{ inputs.platform == 'windows' && 'win32' || 'linux' }}
    timeout-minutes: 45
    # The commit the images were generated from, for the commit job (inputs.branch can differ from github.sha).
    outputs:
      tested: ${{ steps.tested.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Record the tested commit
        id: tested
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Linux system dependencies
        if: inputs.platform != 'windows'
        run: |
          sudo apt-get update
          # Ubuntu 24.04 renamed libasound2 (64-bit time_t); 22.04 has only the old name.
          alsa=libasound2t64; apt-cache show "$alsa" >/dev/null 2>&1 || alsa=libasound2
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 "$alsa" \
            libxshmfence1 libnotify4

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Electron version
        id: electron
        shell: bash
        run: echo "version=$(node -p "require('electron/package.json').version")" >> "$GITHUB_OUTPUT"

      # @electron/get keeps the downloaded Electron zip here; npm rebuild electron and fix:native read it, so a
      # GitHub release-download outage (a 504 on the zip) no longer fails the job once the version is cached.
      - name: Cache the Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/electron/Cache' || '~/.cache/electron' }}
          key: electron-${{ runner.os }}-${{ steps.electron.outputs.version }}

      - name: Build
        run: npm run build

      - name: Prepare and verify native modules for Electron
        run: |
          npm run fix:native
          npm run verify:native

      # The first launch after a build was slower and failed transiently in local runs. A throwaway
      # pass warms it up; its result is ignored on purpose.
      - name: Warm-up (result ignored)
        continue-on-error: true
        run: $RUN npx playwright test --config playwright.visual.config.ts anchor-surfaces

      - name: Generate the baselines
        run: $RUN npx playwright test --config playwright.visual.config.ts --update-snapshots

      # Two consecutive comparisons against what was just written, with no rebuild between them.
      - name: Verify stable, run 1
        run: $RUN npx playwright test --config playwright.visual.config.ts

      - name: Verify stable, run 2
        run: $RUN npx playwright test --config playwright.visual.config.ts

      - name: Upload the baselines
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines-${{ env.SHOTS }}
          if-no-files-found: error
          retention-days: 14
          path: e2e/visual/__screenshots__/${{ env.SHOTS }}/**

      - name: Upload the diffs when it is not stable
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs-${{ env.SHOTS }}
          if-no-files-found: ignore
          retention-days: 7
          path: test-results/**

  # Only on request and only after a fully green generate + two stable verifies. This job runs no project code (no
  # install, no build, no test): it takes the artifact the job above uploaded and commits it, so the write token never
  # meets the code under test. It writes only e2e/visual/__screenshots__/<platform>/ on a test/visual-baselines-*
  # branch, never force-pushes, and refuses any other change.
  commit:
    name: Commit the ${{ inputs.platform || 'linux' }} baselines to ${{ inputs.commit_to_branch }}
    needs: baselines
    if: ${{ inputs.commit_to_branch != '' && needs.baselines.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    env:
      BRANCH: ${{ inputs.commit_to_branch }}
      TESTED: ${{ needs.baselines.outputs.tested }}
      SHOTS: ${{ inputs.platform == 'windows' && 'win32' || 'linux' }}
      PLATFORM: ${{ inputs.platform || 'linux' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check the branch name and the tested commit
        run: |
          set -euo pipefail
          [[ "$BRANCH" =~ ^test/visual-baselines-[A-Za-z0-9._-]+$ ]] || { echo "::error::commit_to_branch must be test/visual-baselines-<name>, got: $BRANCH"; exit 1; }
          [[ "$BRANCH" != *..* ]] || { echo "::error::commit_to_branch may not contain '..'"; exit 1; }
          [[ "$TESTED" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no tested commit from the baselines job"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.baselines.outputs.tested }}
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: visual-baselines-${{ inputs.platform == 'windows' && 'win32' || 'linux' }}
          path: ${{ runner.temp }}/shots

      - name: Commit the images and push, without force
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          dir="e2e/visual/__screenshots__/$SHOTS"
          for attempt in 1 2 3; do
            # Start from the branch when it exists (the other platform may be there already), else from the tested commit.
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
              git fetch -q origin "$BRANCH"
              git checkout -q -B "$BRANCH" FETCH_HEAD
              # The branch must hold only baselines on top of the tested commit's history: nothing else is ever pushed.
              outside=$(git diff --name-only "$TESTED"...HEAD | grep -v '^e2e/visual/__screenshots__/' || true)
              [ -z "$outside" ] || { echo "::error::$BRANCH changes files outside the baselines:"; echo "$outside"; exit 1; }
            else
              git checkout -q -B "$BRANCH" "$TESTED"
            fi
            rm -rf "$dir" && mkdir -p "$dir"
            cp -R "$RUNNER_TEMP/shots/." "$dir/"
            git add -A "$dir"
            other=$(git status --porcelain | grep -v " $dir/" || true)
            [ -z "$other" ] || { echo "::error::refusing to commit anything but $dir:"; echo "$other"; exit 1; }
            if git diff --cached --quiet; then echo "No change in $dir: nothing to commit."; exit 0; fi
            git commit -q -m "test(visual): $PLATFORM baselines from visual-baselines.yml" -m "Generated and verified twice on $TESTED by $RUN_URL."
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo "Pushed $(git rev-parse --short HEAD) to $BRANCH ($(git diff --name-only HEAD~1 | wc -l) file(s))."
              echo "### Committed the $PLATFORM baselines to \`$BRANCH\` ($(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Push rejected (the other platform pushed first?); trying again ($attempt/3)."
            git reset -q --hard "$TESTED"
          done
          echo "::error::could not push to $BRANCH"; exit 1
