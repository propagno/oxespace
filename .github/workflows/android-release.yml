name: Android release
# Builds the companion app's release APK, starts the minified build on an emulator, then signs the APK with the
# project's key, checks the signature, attests the APK's provenance, and attaches the APK and its SHA-256 to the GitHub
# release (never replacing one already there). Runs when a release is published (the desktop's "CI and Release"
# pipeline publishes it) or by hand on an existing vX.Y.Z tag.
#
# Two jobs, so the key is never near third-party build or test code (SECURITY #231):
# - `build`: no secrets, read-only. Unsigned release APK, lint, unit tests, the minified smoke test on an emulator.
# - `sign`: the `android-release` environment (whose rules allow only v* tags, with a reviewer; RELEASING.md) holds the
#   four signing secrets. It only signs the APK `build` made, with apksigner, in one step that alone sees the passwords
#   and deletes the key before it ends.

on:
  release:
    types: [published]
  # Run it on the tag itself (Use workflow from: the vX.Y.Z tag); a run from a branch stops at once.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || github.ref_name }}
  BUILD_TOOLS: "36.0.0"

jobs:
  build:
    name: Build and smoke test
    # Only for a release, or a manual run on a v* tag: a modified copy of this file on a branch never runs.
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - name: The tag is vX.Y.Z
        working-directory: .
        run: echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Tag $TAG is not vX.Y.Z"; exit 1; }

      # The tag by its full name: a branch called like the tag is never built in its place.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: What was checked out is the tag
        working-directory: .
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")" || { echo "::error::HEAD is not $TAG"; exit 1; }

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: "16111833" # cmdline-tools 23.0
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      # versionName and versionCode follow the tag (1.4.2 → 10402), so every release can update the last one.
      - name: Version from the tag
        run: echo "ANDROID_VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"

      # No signing secrets exist in this job, so Gradle builds the release APK unsigned.
      - name: Build the unsigned release APK
        run: ./gradlew --no-daemon lint testReleaseUnitTest :protocol:test assembleRelease

      # MB-M-03: the build R8 shrank, started on an emulator before anything is signed or published. The `minified`
      # build type is the release build with the debug key, so ReleaseSmokeTest installs beside it: the app starts and
      # reads every kind of desktop frame through its generated serializers. A keep rule missing fails here.
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the minified app and its smoke test
        run: ./gradlew --no-daemon -Poxespace.testBuildType=minified assembleMinified assembleMinifiedAndroidTest

      - name: Smoke test the minified build
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: mobile/android
          # A runner that crashes before the first test can still end "successful" with 0 tests, and a skipped test
          # proves nothing: require that they all ran.
          script: |
            ./gradlew --no-daemon -Poxespace.testBuildType=minified connectedMinifiedAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.oxespace.mobile.ReleaseSmokeTest
            grep -Eq 'tests="[3-9]' app/build/outputs/androidTest-results/connected/minified/*.xml || { echo "::error::ReleaseSmokeTest did not run"; exit 1; }
            grep -Eq 'skipped="0"' app/build/outputs/androidTest-results/connected/minified/*.xml || { echo "::error::ReleaseSmokeTest skipped tests"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk
          path: mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign, attest and attach
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The signing secrets live in this environment, not the repository (RELEASING.md).
    environment: android-release
    permissions:
      contents: write # attach the APK to the release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - name: Check the signing secrets
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          missing=""
          [ "$HAS_KEYSTORE" = "true" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ "$HAS_STORE_PASSWORD" = "true" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ "$HAS_ALIAS" = "true" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ "$HAS_KEY_PASSWORD" = "true" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Secrets missing in the android-release environment:$missing. See mobile/android/RELEASING.md."
            exit 1
          fi

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: "16111833" # cmdline-tools 23.0
          log-accepted-android-sdk-licenses: false
          packages: build-tools;36.0.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apk
          path: ${{ runner.temp }}/unsigned

      # The only step that sees the key: written, used and deleted here, whatever happens.
      - name: Sign the APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          key="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key"
          "$tools/zipalign" -P 16 -f 4 "$RUNNER_TEMP/unsigned/app-release-unsigned.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$key" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$RUNNER_TEMP/app-release.apk" "$RUNNER_TEMP/aligned.apk"

      - name: Verify the signature and name the file
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/app-release.apk"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apksigner.txt"
          # minSdk 28 gets the v3 scheme (v2 is left out when v3 covers every supported version); either proves it.
          grep -Eq "Verified using v(2|3) scheme \(APK Signature Scheme v(2|3)\): true" "$RUNNER_TEMP/apksigner.txt"
          name="oxespace-android-${TAG}.apk"
          cp "$apk" "$RUNNER_TEMP/$name"
          (cd "$RUNNER_TEMP" && sha256sum "$name" > "$name.sha256")
          {
            echo "### Android APK"
            echo '```'
            cat "$RUNNER_TEMP/$name.sha256"
            grep "certificate SHA-256 digest" "$RUNNER_TEMP/apksigner.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "APK_NAME=$name" >> "$GITHUB_ENV"

      # MB-M-06: a signed statement, kept by GitHub, that this APK came from this workflow at this tag.
      - name: Attest the APK's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/${{ env.APK_NAME }}

      # Never --clobber: an APK already attached to this tag is not replaced; the job fails and says so.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/$APK_NAME" "$RUNNER_TEMP/$APK_NAME.sha256" --repo "$GITHUB_REPOSITORY"
