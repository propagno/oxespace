name: Android release
# Builds the companion app's release APK, signs it with the project's key, checks the signature, starts the minified
# build on an emulator, attests the APK's provenance, and attaches the APK and its SHA-256 to the GitHub release
# (never replacing one already there). Runs when a release is published (the desktop's "CI and Release"
# pipeline publishes it) or by hand for an existing tag.
#
# The signing key never lives in the repository: it comes from four repository secrets the maintainer registers
# (see mobile/android/RELEASING.md). Without them the job stops before building and says which are missing.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the APK to (vX.Y.Z)
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apk:
    name: Signed APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # attach the APK to the release
      id-token: write # sign the provenance attestation
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - name: Check the signing secrets
        working-directory: .
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          missing=""
          [ "$HAS_KEYSTORE" = "true" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ "$HAS_STORE_PASSWORD" = "true" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ "$HAS_ALIAS" = "true" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ "$HAS_KEY_PASSWORD" = "true" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Repository secrets missing:$missing. See mobile/android/RELEASING.md."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: "16111833" # cmdline-tools 23.0
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The keystore is written to the runner's temp folder only for this job and removed at the end.
      - name: Restore the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # versionName and versionCode follow the tag (1.4.2 → 10402), so every release can update the last one.
      - name: Version from the tag
        run: |
          version="${TAG#v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Tag $TAG is not vX.Y.Z"; exit 1; }
          echo "ANDROID_VERSION_NAME=$version" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon lint testReleaseUnitTest :protocol:test assembleRelease

      - name: Verify the signature and name the file
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apksigner.txt"
          # minSdk 28 gets the v3 scheme (v2 is left out when v3 covers every supported version); either proves it.
          grep -Eq "Verified using v(2|3) scheme \(APK Signature Scheme v(2|3)\): true" "$RUNNER_TEMP/apksigner.txt"
          name="oxespace-android-${TAG}.apk"
          cp "$apk" "$RUNNER_TEMP/$name"
          (cd "$RUNNER_TEMP" && sha256sum "$name" > "$name.sha256")
          {
            echo "### Android APK"
            echo '```'
            cat "$RUNNER_TEMP/$name.sha256"
            grep "certificate SHA-256 digest" "$RUNNER_TEMP/apksigner.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "APK_NAME=$name" >> "$GITHUB_ENV"

      # MB-M-03: the build R8 shrank, started on an emulator before anything is published. The `minified` build type
      # is the release build with the debug key, so ReleaseSmokeTest installs beside it: the app starts and reads every
      # kind of desktop frame through its generated serializers. A keep rule missing fails here, not on a phone.
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the minified app and its smoke test
        run: ./gradlew --no-daemon -Poxespace.testBuildType=minified assembleMinified assembleMinifiedAndroidTest

      - name: Smoke test the minified build
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: mobile/android
          # A runner that crashes before the first test can still end "successful" with 0 tests: require that they ran.
          script: |
            ./gradlew --no-daemon -Poxespace.testBuildType=minified connectedMinifiedAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.oxespace.mobile.ReleaseSmokeTest
            grep -Eq 'tests="[3-9]' app/build/outputs/androidTest-results/connected/minified/*.xml || { echo "::error::ReleaseSmokeTest did not run"; exit 1; }

      # MB-M-06: a signed statement, kept by GitHub, that this APK came from this workflow at this tag.
      - name: Attest the APK's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/${{ env.APK_NAME }}

      # Never --clobber: an APK already attached to this tag is not replaced; the job fails and says so.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/$APK_NAME" "$RUNNER_TEMP/$APK_NAME.sha256"

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
