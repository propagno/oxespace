name: Acceptance (on demand)

# S0.4 · Runs ONE acceptance spec (e2e/acceptance, written before its item lands) against any version of the app, on CI
# instead of the team's machine. Manual dispatch only: never on push or pull_request, so a spec that is red on purpose
# never blocks a merge or the merge train.
#
# The app comes from `product_ref` (main or a PR head). The spec comes from `spec_ref`, and only e2e/acceptance/** and
# playwright.acceptance.config.ts are copied from it: nothing from spec_ref runs at install or build time.
#
# product_ref runs code as fully as spec_ref: its install, build and e2e entry all run here. So both must be a branch
# or tag of THIS repository, checked to exist (never refs/..., a pull request head, a fork or a bare SHA), and no npm
# cache is saved or restored, so nothing from a run can reach the cache main's builds use.
#
# Safety: read-only token, no secrets, nothing published but the run's own test results. Inputs reach the shell only
# through env and are format-checked first. The acceptance config scrubs a live OXESpace app's env (#337) and the
# e2e entry stubs native dialogs (#351) when product_ref has it; the specs stub them too.

on:
  workflow_dispatch:
    inputs:
      product_ref:
        description: "App under test: a branch or tag of this repository"
        required: true
        default: main
      spec_ref:
        description: "Branch or tag of this repository that holds the acceptance spec"
        required: true
      spec:
        description: "The spec file, e.g. e2e/acceptance/S2-sessions-survive.spec.ts"
        required: true
      grep:
        description: "Optional test title filter (-g)"
        required: false
        default: ""
      os:
        description: "Runner"
        type: choice
        options: [windows-2022, ubuntu-24.04]
        default: windows-2022

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  acceptance:
    name: ${{ inputs.spec }} on ${{ inputs.product_ref }} (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    env:
      PRODUCT_REF: ${{ inputs.product_ref }}
      SPEC_REF: ${{ inputs.spec_ref }}
      SPEC: ${{ inputs.spec }}
      GREP: ${{ inputs.grep }}
    steps:
      - name: Check inputs
        shell: bash
        run: |
          set -euo pipefail
          ref='^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$'
          for name in PRODUCT_REF SPEC_REF; do
            value="${!name}"
            if [[ ! "$value" =~ $ref || "$value" == *..* || "$value" == */ || "$value" == *.lock || "$value" == refs/* ]]; then
              echo "::error::$name must be a branch or tag name of this repository (letters, digits, . _ / -; not refs/...)"; exit 1
            fi
            # checkout reads a full hex name as a commit, so a branch named like one could fetch any commit.
            if [[ "$value" =~ ^[0-9a-fA-F]{40}([0-9a-fA-F]{24})?$ ]]; then
              echo "::error::$name looks like a commit SHA; use a branch or tag name"; exit 1
            fi
          done
          spec='^e2e/acceptance/[A-Za-z0-9][A-Za-z0-9._-]{0,120}\.spec\.ts$'
          if [[ ! "$SPEC" =~ $spec || "$SPEC" == *..* ]]; then
            echo "::error::spec must be a file directly under e2e/acceptance/ ending in .spec.ts"; exit 1
          fi
          grep_ok='^[A-Za-z0-9 ._()\\:-]{1,80}$'
          if [[ -n "$GREP" && ( ! "$GREP" =~ $grep_ok || "$GREP" == -* ) ]]; then
            echo "::error::grep may use letters, digits, spaces and . _ ( ) \\ : - (80 at most), and may not start with -"; exit 1
          fi

      - name: Both refs are branches or tags of this repository (pinned to the commit found)
        id: refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha='^[0-9a-f]{40}$'
          for name in PRODUCT_REF SPEC_REF; do
            value="${!name}"
            commit=''
            if commit=$(gh api "repos/$REPO/git/ref/heads/$value" -q '.object.sha' 2>/dev/null); then echo "$name: branch $value"
            elif tagged=$(gh api "repos/$REPO/git/ref/tags/$value" -q '.object.type + " " + .object.sha' 2>/dev/null); then
              echo "$name: tag $value"
              commit="${tagged#* }"
              # An annotated tag points at a tag object: peel it to its commit.
              if [[ "${tagged%% *}" == tag ]]; then commit=$(gh api "repos/$REPO/git/tags/$commit" -q '.object.sha'); fi
            else
              echo "::error::$name is not a branch or tag of $REPO (pull request heads, forks and bare SHAs are refused)"; exit 1
            fi
            if [[ ! "$commit" =~ $sha ]]; then echo "::error::$name did not resolve to a commit"; exit 1; fi
            # Checkout uses this commit, never the name: a branch that moves after this check changes nothing.
            echo "$(tr 'A-Z' 'a-z' <<< "$name")=$commit" >> "$GITHUB_OUTPUT"
            echo "$name -> $commit"
          done

      - name: Check out the app under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.refs.outputs.product_ref }}
          persist-credentials: false

      - name: Check out the spec (not run, only copied)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.refs.outputs.spec_ref }}
          path: .acceptance-spec-src
          persist-credentials: false
          sparse-checkout: |
            e2e/acceptance
            playwright.acceptance.config.ts
          sparse-checkout-cone-mode: false

      - name: Overlay ONLY e2e/acceptance/** and playwright.acceptance.config.ts
        shell: bash
        run: |
          set -euo pipefail
          src=.acceptance-spec-src
          test -f "$src/$SPEC" || { echo "::error::$SPEC is not in spec_ref"; exit 1; }
          test -f "$src/playwright.acceptance.config.ts" || { echo "::error::spec_ref has no playwright.acceptance.config.ts"; exit 1; }
          # No links: a symlink in spec_ref could point the copy outside these paths.
          if find "$src/e2e/acceptance" "$src/playwright.acceptance.config.ts" -type l | grep -q .; then echo "::error::spec_ref holds symlinks"; exit 1; fi
          rm -rf e2e/acceptance
          mkdir -p e2e/acceptance
          cp -R "$src/e2e/acceptance/." e2e/acceptance/
          cp "$src/playwright.acceptance.config.ts" playwright.acceptance.config.ts
          rm -rf "$src"
          git status --short

      - name: Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          # No npm cache, saved or restored: a run's dependencies must never reach the cache main's builds use.
          package-manager-cache: false

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2 \
            libxshmfence1 libnotify4

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Install the pinned Electron runtime
        run: npm rebuild electron

      - name: Build the app under test
        run: npm run build

      - name: Prepare native modules for Electron
        run: npm run fix:native

      - name: No live OXESpace env reaches the run
        shell: bash
        run: |
          set -euo pipefail
          # The same names playwright.acceptance.config.ts and e2e/helpers/live-app-env.ts (#337) scrub.
          # Exactly #337's LIVE_APP_ENV, case-insensitive like its /i.
          if env | cut -d= -f1 | grep -Ei '^(OXESPACE_(MCP_|EXECUTION_|AGENT_HOOK_|WORKSPACE_ID$|MEMORY_RUN(_ID)?$|PANE_BRIDGE$)|AI_MEMORY_)'; then
            echo "::error::live OXESpace variables are set on the runner"; exit 1
          fi

      - name: Run the spec (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          args=(-c playwright.acceptance.config.ts "$SPEC" --trace retain-on-failure)
          if [[ -n "$GREP" ]]; then args+=("--grep=$GREP"); fi
          npx playwright test "${args[@]}"

      - name: Run the spec (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          args=(-c playwright.acceptance.config.ts "$SPEC" --trace retain-on-failure)
          if [[ -n "$GREP" ]]; then args+=("--grep=$GREP"); fi
          bash scripts/run-with-xvfb.sh npx playwright test "${args[@]}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-${{ github.run_id }}-${{ inputs.os }}
          if-no-files-found: ignore
          retention-days: 7
          path: test-results/
