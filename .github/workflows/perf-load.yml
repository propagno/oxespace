# The app under real terminal load (OXE-120): e2e/perf-load.spec.ts on the built app with real PTYs, 8 panes printing
# ~1 MB/s for 20 s and 1 idle pane, 3 rounds; it reports the main process's loop delay, key echo, Ctrl K, workspace
# switch and working set as `[LOAD]` lines, in the run summary and in the perf-load-<os> artifact.
# Report only until the first 5 runs on main set the limits (CA-5). One job per OS (CA-7), so a slow Windows run never
# holds Linux back; the same load on both (RT-3). CI only, never on a developer machine (RT-1).
# On main, only the newest push is measured: a newer one cancels the run in progress (it frees the runners for the
# merge train, which shares them).
name: Performance under load
run-name: Performance under load · ${{ github.ref_name }}

on:
  push:
    branches: [main, "ci/perf-load-*"]
  workflow_dispatch:

concurrency:
  group: perf-load-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  load:
    name: Load (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-2022
          - label: linux-x64
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          alsa=libasound2
          if dpkg -s libasound2t64 >/dev/null 2>&1; then alsa=libasound2t64; fi
          req=(xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 "$alsa" libxshmfence1)
          apt_opts=(-o APT::Sandbox::User=root -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 -o Acquire::Retries=1)
          if ! dpkg -s "${req[@]}" >/dev/null 2>&1; then
            if getent ahostsv4 archive.ubuntu.com >/dev/null 2>&1 && timeout 180 sudo apt-get "${apt_opts[@]}" update && timeout 300 sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends "${req[@]}"; then
              :
            else
              exit 1
            fi
          fi

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Install the pinned Electron runtime
        run: npm rebuild electron

      - name: Build renderer and main process
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run rebuild:native:node
          npm run build

      - name: Prepare and verify native modules for Electron
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run fix:native
          npm run verify:native

      - name: Load test
        shell: bash
        env:
          OXESPACE_LOAD_RESULTS: ${{ github.workspace }}/results/perf-load/results.txt
        run: |
          set -o pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            bash scripts/run-with-xvfb.sh npx playwright test --config playwright.tools.config.ts e2e/perf-load.spec.ts --reporter=line 2>&1 | tee results-log.txt
          else
            npx playwright test --config playwright.tools.config.ts e2e/perf-load.spec.ts --reporter=line 2>&1 | tee results-log.txt
          fi

      - name: Summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo "### Performance under load (${{ matrix.label }})"
            echo
            echo '```'
            if [[ -f results/perf-load/results.txt ]]; then cat results/perf-load/results.txt; else grep -a '\[LOAD\]' results-log.txt || echo "no [LOAD] lines"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p results/perf-load
          cp results-log.txt results/perf-load/ 2>/dev/null || true

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-load-${{ matrix.label }}
          if-no-files-found: warn
          retention-days: 30
          path: results/perf-load/
