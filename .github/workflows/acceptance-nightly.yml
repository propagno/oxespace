name: Acceptance e2e (nightly)

# OXE-296: runs the full e2e/acceptance suite (playwright.acceptance.config.ts) every night against main so stale
# frozen specs are caught within a day rather than on release day. Never runs on pull_request or merge-train.

on:
  schedule:
    # 06:00 UTC = 03:00 in Brasília: after packaged-smoke-nightly, while the merge train is quiet.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      os:
        description: "Runner"
        type: choice
        options: [ubuntu-24.04, windows-2022]
        default: ubuntu-24.04

permissions:
  contents: read

concurrency:
  group: acceptance-nightly-${{ inputs.os || 'ubuntu-24.04' }}
  cancel-in-progress: false

jobs:
  acceptance-nightly:
    name: Acceptance e2e (nightly) (${{ inputs.os || 'ubuntu-24.04' }})
    runs-on: ${{ inputs.os || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          alsa=libasound2t64; apt-cache show "$alsa" >/dev/null 2>&1 || alsa=libasound2
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 "$alsa" \
            libxshmfence1 libnotify4

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Electron version
        id: electron
        shell: bash
        run: echo "version=$(node -p "require('electron/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/electron/Cache' || '~/.cache/electron' }}
          key: electron-${{ runner.os }}-${{ steps.electron.outputs.version }}

      - name: Install the pinned Electron runtime
        run: npm rebuild electron

      - name: Build the app
        run: npm run build

      - name: Prepare native modules for Electron
        run: npm run fix:native

      - name: No live OXESpace env reaches the run
        shell: bash
        run: |
          set -euo pipefail
          # Same LIVE_APP_ENV guard as acceptance.yml (#337).
          if env | cut -d= -f1 | grep -Ei '^(OXESPACE_(MCP_|EXECUTION_|AGENT_HOOK_|WORKSPACE_ID$|MEMORY_RUN(_ID)?$|PANE_BRIDGE$)|AI_MEMORY_)'; then
            echo "::error::live OXESpace variables are set on the runner"; exit 1
          fi

      - name: Run acceptance suite (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test -c playwright.acceptance.config.ts --trace retain-on-failure

      - name: Run acceptance suite (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run-with-xvfb.sh npx playwright test -c playwright.acceptance.config.ts --trace retain-on-failure

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-nightly-${{ github.run_id }}-${{ inputs.os || 'ubuntu-24.04' }}
          if-no-files-found: ignore
          retention-days: 7
          path: test-results/
