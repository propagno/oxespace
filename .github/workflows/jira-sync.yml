name: Jira sync

# Keeps the OXE items in Jira in step with pull requests and releases (scripts/jira-sync.mjs, tested in
# tests/unit/jira-sync.test.ts). A PR names its items with the key in its title or branch: open → Em revisão,
# `na-fila` → Na fila, merged → Na main; a published vX.Y.Z releases that Jira version and lands its items in
# Lançado. The schedule is what sees the train's merges and unlabels: they are made with GITHUB_TOKEN, whose events
# start no workflow. A Jira failure is a warning, never a failed run.

on:
  # pull_request_target: the script always comes from main; nothing from the PR is checked out or run.
  pull_request_target:
    types: [opened, reopened, edited, labeled, unlabeled, closed]
  release:
    types: [published]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: jira-sync
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    name: Jira sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/jira-sync.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Reconcile Jira with pull requests and releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          JIRA_SITE: ${{ vars.JIRA_SITE }}
          JIRA_PROJECT: ${{ vars.JIRA_PROJECT || 'OXE' }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: node scripts/jira-sync.mjs
