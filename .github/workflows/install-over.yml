name: Install over the last stable

# Release gate G4 (.claude/roadmap-1.4/team/release-gate.md, docs/ci-cd.md): what a user who has v1.3.3 gets from
# the candidate's installer, on a clean Windows runner. The steps:
#   1. install the public v1.3.3 installer silently and let it create a workspace (seed, database v77);
#   2. build this commit's NSIS installer with the candidate version and install it over v1.3.3 silently;
#   3. open it on the old data (verify-upgrade: version, shortcuts, the old workspace with no native dialog,
#      database migrated with integrity ok, the pre-upgrade backup at v77);
#   4. uninstall silently (verify-uninstall: program and shortcuts gone, user data kept).
# The checks are HOMOLOGATION's e2e/release/upgrade-over-1.3.3.spec.ts; they run only on a CI runner, because they
# use that machine's real %APPDATA%. Publishes nothing, uses no secret: v1.3.3 comes from the public release.
# Linux runs the same steps for the .deb (apt install, downgrade, remove) and the AppImage (job `linux`).

on:
  workflow_dispatch:
    inputs:
      candidate_version:
        description: Version stamped on the candidate installer (package.json on main may still say the last stable)
        required: false
        default: "1.4.0-rc.0"
        type: string
      from_tag:
        description: Release installed first
        required: false
        default: "v1.3.3"
        type: string
  # The workflow and its checks validate themselves on the pull request that changes them.
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/install-over.yml"
      - "e2e/release/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Install over ${{ inputs.from_tag || 'v1.3.3' }} (windows-x64)
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      FROM_TAG: ${{ inputs.from_tag || 'v1.3.3' }}
      CANDIDATE_VERSION: ${{ inputs.candidate_version || '1.4.0-rc.0' }}
      OXESPACE_UPGRADE_STATE: ${{ github.workspace }}\upgrade-state
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Install ${{ env.FROM_TAG }} silently
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force -Path $env:OXESPACE_UPGRADE_STATE, "$env:RUNNER_TEMP\from" | Out-Null
          $version = $env:FROM_TAG.TrimStart('v')
          $installer = "OXESpace-$version-x64.exe"
          gh release download $env:FROM_TAG --repo $env:GITHUB_REPOSITORY --pattern $installer --pattern SHA256SUMS.txt --dir "$env:RUNNER_TEMP\from"
          # The published checksum, so the job installs exactly what users downloaded.
          $expected = (Select-String -Path "$env:RUNNER_TEMP\from\SHA256SUMS.txt" -Pattern ([regex]::Escape($installer))).Line.Split(' ')[0]
          $actual = (Get-FileHash "$env:RUNNER_TEMP\from\$installer" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Checksum mismatch for ${installer}: $actual, published $expected" }
          $p = Start-Process "$env:RUNNER_TEMP\from\$installer" -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "$installer /S exited with $($p.ExitCode)" }
          Write-Host "Installed $env:FROM_TAG in $env:LOCALAPPDATA\Programs\OXESpace"

      - name: "Seed: the old release creates a workspace"
        run: npx playwright test -c playwright.tools.config.ts e2e/release/upgrade-over-1.3.3.spec.ts
        env:
          OXESPACE_UPGRADE_STEP: seed

      - name: Electron version
        id: electron
        shell: bash
        run: echo "version=$(node -p "require('electron/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ steps.electron.outputs.version }}

      # The same build as ci.yml's package job (Windows leg), with the candidate's version stamped first.
      - name: Build the candidate installer (${{ env.CANDIDATE_VERSION }})
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm version $env:CANDIDATE_VERSION --no-git-tag-version --allow-same-version
          $channel = if ($env:CANDIDATE_VERSION -match '-') { 'beta' } else { 'latest' }
          npm rebuild electron
          npm run rebuild:native:node
          npm run build
          npm run fix:native
          npm run verify:native
          npm rebuild sharp
          node scripts/slim-pack-deps.mjs --platform=win32 --arch=x64
          npx electron-builder --win --config.npmRebuild=false --config.publish.channel=$channel --publish never
          $installer = "dist\OXESpace-$env:CANDIDATE_VERSION-x64.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "No installer at $installer" }
          '[installer-size] {0} {1:N1} MB' -f $installer, ((Get-Item $installer).Length / 1MB)

      - name: Install the candidate over ${{ env.FROM_TAG }} silently
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Start-Process "dist\OXESpace-$env:CANDIDATE_VERSION-x64.exe" -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "candidate /S exited with $($p.ExitCode)" }

      # B13 (#378) ships the --inspect fuse off, and Playwright's _electron.launch needs --inspect: against the installed
      # candidate as shipped, the launch timed out (G4 red since #378). First prove the installed exe carries every fuse
      # as configured, then turn back on only that one fuse, as ci.yml does for its packaged E2E copy, and prove it is
      # the only byte that changed.
      - name: "B13: let Playwright attach to the installed candidate"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\OXESpace\OXESpace.exe'
          node scripts/check-fuses.mjs --app $exe
          $shipped = Join-Path $env:RUNNER_TEMP 'OXESpace.shipped.exe'
          Copy-Item $exe $shipped
          npx --no-install @electron/fuses write --app $exe EnableNodeCliInspectArguments=on
          node scripts/check-fuses.mjs --app $exe --test-copy-of $shipped

      - name: "Verify the upgrade"
        run: npx playwright test -c playwright.tools.config.ts e2e/release/upgrade-over-1.3.3.spec.ts
        env:
          OXESPACE_UPGRADE_STEP: verify-upgrade
          OXESPACE_EXPECT_VERSION: ${{ env.CANDIDATE_VERSION }}

      # The exe exactly as the installer shipped it (every fuse as configured, --inspect off), started the way a person
      # starts it, without Playwright, on the upgraded profile: it must still be running after 20 s. Its main.log is
      # kept with the job's state.
      - name: "The shipped exe runs on the upgraded profile without Playwright"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\OXESpace\OXESpace.exe'
          Copy-Item -Force (Join-Path $env:RUNNER_TEMP 'OXESpace.shipped.exe') $exe
          node scripts/check-fuses.mjs --app $exe
          $out = 'upgrade-state/shipped-exe'
          New-Item -ItemType Directory -Force $out | Out-Null
          # main.log keeps the earlier runs (the 1.3.3 seed, the verify step): only the lines this launch adds count.
          $log = Join-Path $env:APPDATA 'OXESpace\logs\main.log'
          $skip = if (Test-Path $log) { @(Get-Content $log).Count } else { 0 }
          $p = Start-Process $exe -PassThru -RedirectStandardOutput "$out/stdout.txt" -RedirectStandardError "$out/stderr.txt"
          Start-Sleep -Seconds 25
          $alive = -not $p.HasExited
          # A window the person can see: Windows reports the main window of the app's processes (the browser process
          # owns it), with its title.
          $windows = @(Get-Process | Where-Object { $_.ProcessName -match '^OXESpace' -and $_.MainWindowHandle -ne 0 } |
            ForEach-Object { "pid $($_.Id): '$($_.MainWindowTitle)'" })
          "alive after 25 s: $alive$(if (-not $alive) { "; exit code $($p.ExitCode)" })" | Tee-Object "$out/result.txt"
          "windows: $($windows -join '; ')" | Tee-Object -Append "$out/result.txt"
          $errors = @()
          if (Test-Path $log) {
            Copy-Item $log "$out/main.log"
            $mine = @(Get-Content $log | Select-Object -Skip $skip)
            $mine | Set-Content "$out/main.this-launch.log"
            # electron-log writes "[date time] [level] message"; an [error] line from this launch fails the step.
            $errors = @($mine | Where-Object { $_ -match '\] \[error\] ' })
            Write-Host "--- main.log, this launch ($($mine.Count) lines) ---"; $mine | Write-Host; Write-Host '--- end ---'
          } else { 'no main.log' | Tee-Object -Append "$out/result.txt" }
          "error lines in main.log: $($errors.Count)" | Tee-Object -Append "$out/result.txt"
          $errors | ForEach-Object { Write-Host "::error title=main.log::$_" }
          # Quit the way a person does: close the window, and give the app 10 s to quit (a clean quit also moves the
          # database's WAL into the file). Force only if it is still running, and say which one ended it.
          $closer = 'already gone'
          if ($alive) {
            Get-Process | Where-Object { $_.ProcessName -match '^OXESpace' -and $_.MainWindowHandle -ne 0 } | ForEach-Object { [void]$_.CloseMainWindow() }
            $closer = 'window closed'
            $deadline = (Get-Date).AddSeconds(10)
            while ((Get-Process | Where-Object { $_.ProcessName -match '^OXESpace' }) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
            if (Get-Process | Where-Object { $_.ProcessName -match '^OXESpace' }) {
              Get-Process | Where-Object { $_.ProcessName -match '^OXESpace' } | Stop-Process -Force -ErrorAction SilentlyContinue
              $closer = 'forced after 10 s (the window did not quit the app)'
              Start-Sleep -Seconds 3
            }
          }
          "ended by: $closer" | Tee-Object -Append "$out/result.txt"
          $wal = Join-Path $env:APPDATA 'OXESpace\oxespace.sqlite3-wal'
          "wal after quit: $(if (Test-Path $wal) { (Get-Item $wal).Length } else { 'none' }) bytes" | Tee-Object -Append "$out/result.txt"
          if (-not $alive) { throw 'the shipped exe exited within 25 s on the upgraded profile' }
          if ($windows.Count -eq 0) { throw 'the shipped exe runs but shows no window after 25 s' }
          if ($errors.Count -gt 0) { throw "main.log has $($errors.Count) error line(s); see the annotations" }

      # G8 (docs/ci-cd.md, "When a release goes wrong"): a user who already updated goes back to the last stable.
      # The runbook's steps, in order: reinstall the previous installer, see that it refuses the upgraded database
      # without touching it, restore the backup the upgrade took, open the previous release on it.
      - name: "Rollback: reinstall ${{ env.FROM_TAG }} over the candidate"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:FROM_TAG.TrimStart('v')
          # The version the app reports (no "v"), for the checks below.
          "FROM_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $p = Start-Process "$env:RUNNER_TEMP\from\OXESpace-$version-x64.exe" -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "$env:FROM_TAG /S over the candidate exited with $($p.ExitCode)" }

      - name: "Rollback: the previous release refuses the upgraded database"
        run: npx playwright test -c playwright.tools.config.ts e2e/release/upgrade-over-1.3.3.spec.ts
        env:
          OXESPACE_UPGRADE_STEP: verify-refuse
          OXESPACE_EXPECT_VERSION: ${{ env.FROM_VERSION }}

      - name: "Rollback: restore the pre-upgrade backup"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $seed = Get-Content -Raw "$env:OXESPACE_UPGRADE_STATE\seed.json" | ConvertFrom-Json
          $userData = $seed.userData
          Get-Process -Name OXESpace -ErrorAction SilentlyContinue | Stop-Process -Force
          # The backup of the release installed first, whatever its schema (v77 for 1.3.3). Two releases on the same
          # schema migrate nothing, so there is no backup: then the data is already what the old release can open.
          $backup = Get-ChildItem "$userData\db-backups" -Filter "oxespace-v$($seed.dbVersion)-*.sqlite3" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $backup) {
            # Skip only for the reason the upgrade check recorded; a moved schema with no backup is a failure here too.
            $up = Get-Content -Raw "$env:OXESPACE_UPGRADE_STATE\verify-upgrade.json" | ConvertFrom-Json
            if (-not $up.noMigration) { throw "Schema moved but no db-backups\oxespace-v$($seed.dbVersion)-*.sqlite3 in $userData" }
            Write-Host "No db-backups\oxespace-v$($seed.dbVersion)-*.sqlite3: $($up.noMigration)"; exit 0
          }
          foreach ($suffix in '', '-wal', '-shm') { Remove-Item -LiteralPath "$userData\oxespace.sqlite3$suffix" -Force -ErrorAction SilentlyContinue }
          Copy-Item -LiteralPath $backup.FullName -Destination "$userData\oxespace.sqlite3"
          Write-Host "Restored $($backup.Name) to $userData\oxespace.sqlite3"

      - name: "Rollback: the previous release opens the restored data"
        run: npx playwright test -c playwright.tools.config.ts e2e/release/upgrade-over-1.3.3.spec.ts
        env:
          OXESPACE_UPGRADE_STEP: verify-rollback
          OXESPACE_EXPECT_VERSION: ${{ env.FROM_VERSION }}

      - name: Uninstall silently
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $uninstaller = "$env:LOCALAPPDATA\Programs\OXESpace\Uninstall OXESpace.exe"
          if (-not (Test-Path -LiteralPath $uninstaller)) { throw "No uninstaller at $uninstaller" }
          $p = Start-Process $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstaller /S exited with $($p.ExitCode)" }
          # NSIS copies its uninstaller to %TEMP% and returns at once; wait for the folder to go.
          for ($i = 0; $i -lt 60 -and (Test-Path -LiteralPath "$env:LOCALAPPDATA\Programs\OXESpace\OXESpace.exe"); $i++) { Start-Sleep -Seconds 2 }

      - name: "Verify the uninstall"
        run: npx playwright test -c playwright.tools.config.ts e2e/release/upgrade-over-1.3.3.spec.ts
        env:
          OXESPACE_UPGRADE_STEP: verify-uninstall

      - name: Keep the state and the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-over-windows-x64
          retention-days: 30
          if-no-files-found: warn
          path: |
            upgrade-state/
            test-results/
            playwright-report/

  # The same steps on Linux, for both packages we publish. The .deb installs system-wide through apt (and is
  # downgraded with --allow-downgrades for the rollback); the AppImage has nothing to install, so each step runs the
  # matching file, extracted (no FUSE on runners), and there's no uninstall to check.
  linux:
    name: Install over ${{ inputs.from_tag || 'v1.3.3' }} (linux-x64, ${{ matrix.kind }})
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kind: [deb, appimage]
    env:
      FROM_TAG: ${{ inputs.from_tag || 'v1.3.3' }}
      CANDIDATE_VERSION: ${{ inputs.candidate_version || '1.4.0-rc.0' }}
      OXESPACE_UPGRADE_STATE: ${{ github.workspace }}/upgrade-state
      OXESPACE_INSTALL_KIND: ${{ matrix.kind }}
      APPIMAGE_EXTRACT_AND_RUN: "1"
      SPEC: e2e/release/upgrade-over-1.3.3.spec.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Linux system dependencies
        run: |
          sudo apt-get update
          # Ubuntu 24.04 renamed libasound2 (64-bit time_t); 22.04 has only the old name.
          alsa=libasound2t64; apt-cache show "$alsa" >/dev/null 2>&1 || alsa=libasound2
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 "$alsa" \
            libxshmfence1 libnotify4 x11-utils

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Download ${{ env.FROM_TAG }} (${{ matrix.kind }})
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$OXESPACE_UPGRADE_STATE" "$RUNNER_TEMP/from"
          version="${FROM_TAG#v}"
          if [ "$OXESPACE_INSTALL_KIND" = deb ]; then file="OXESpace-$version-amd64.deb"; else file="OXESpace-$version-x64.AppImage"; fi
          gh release download "$FROM_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$file" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/from"
          # The published checksum, so the job installs exactly what users downloaded.
          expected=$(grep -F "$file" "$RUNNER_TEMP/from/SHA256SUMS.txt" | awk '{print tolower($1)}')
          actual=$(sha256sum "$RUNNER_TEMP/from/$file" | awk '{print $1}')
          [ -n "$expected" ] && [ "$expected" = "$actual" ] || { echo "::error::checksum mismatch for $file: $actual, published $expected"; exit 1; }
          chmod +x "$RUNNER_TEMP/from/$file"
          echo "FROM_FILE=$RUNNER_TEMP/from/$file" >> "$GITHUB_ENV"
          echo "FROM_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install ${{ env.FROM_TAG }}
        run: |
          set -euo pipefail
          if [ "$OXESPACE_INSTALL_KIND" = deb ]; then
            sudo apt-get install -y "$FROM_FILE"
            echo "OXESPACE_EXECUTABLE=/opt/OXESpace/oxespace" >> "$GITHUB_ENV"
            ls -l /opt/OXESpace/oxespace /opt/OXESpace/chrome-sandbox
          else
            echo "OXESPACE_EXECUTABLE=$FROM_FILE" >> "$GITHUB_ENV"
          fi

      - name: "Seed: the old release creates a workspace"
        run: xvfb-run -a npx playwright test -c playwright.tools.config.ts "$SPEC"
        env:
          OXESPACE_UPGRADE_STEP: seed

      - name: Electron version
        id: electron
        run: echo "version=$(node -p "require('electron/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ steps.electron.outputs.version }}

      # The same build as ci.yml's package job (Linux leg), with the candidate's version stamped first.
      - name: Build the candidate packages (${{ env.CANDIDATE_VERSION }})
        run: |
          set -euo pipefail
          npm version "$CANDIDATE_VERSION" --no-git-tag-version --allow-same-version
          case "$CANDIDATE_VERSION" in *-*) channel=beta ;; *) channel=latest ;; esac
          npm rebuild electron
          npm run rebuild:native:node
          npm run build
          npm run fix:native
          npm run verify:native
          npm rebuild sharp
          node scripts/slim-pack-deps.mjs --platform=linux --arch=x64
          npx electron-builder --linux --config.npmRebuild=false --config.publish.channel=$channel --publish never
          deb=$(ls dist/*.deb | head -1)
          appimage=$(ls dist/*.AppImage | head -1)
          if [ -z "$deb" ] || [ -z "$appimage" ]; then echo "::error::missing .deb or AppImage in dist/"; ls dist; exit 1; fi
          chmod +x "$appimage"
          echo "CANDIDATE_DEB=$PWD/$deb" >> "$GITHUB_ENV"
          echo "CANDIDATE_APPIMAGE=$PWD/$appimage" >> "$GITHUB_ENV"
          ls -l "$deb" "$appimage"

      - name: Install the candidate over ${{ env.FROM_TAG }}
        run: |
          set -euo pipefail
          if [ "$OXESPACE_INSTALL_KIND" = deb ]; then
            sudo apt-get install -y "$CANDIDATE_DEB"
          else
            echo "OXESPACE_EXECUTABLE=$CANDIDATE_APPIMAGE" >> "$GITHUB_ENV"
          fi

      # B13, as on Windows: the shipped binary carries every fuse as configured, and Playwright, which needs --inspect,
      # gets that binary with only that fuse turned back on. An AppImage cannot be changed in place, so its extracted
      # binary is checked and used instead.
      - name: "B13: let Playwright attach to the installed candidate"
        run: |
          set -euo pipefail
          check="$GITHUB_WORKSPACE/scripts/check-fuses.mjs"
          if [ "$OXESPACE_INSTALL_KIND" = deb ]; then
            bin=/opt/OXESpace/oxespace
          else
            rm -rf "$RUNNER_TEMP/appimage" && mkdir -p "$RUNNER_TEMP/appimage"
            (cd "$RUNNER_TEMP/appimage" && "$CANDIDATE_APPIMAGE" --appimage-extract >/dev/null)
            bin="$RUNNER_TEMP/appimage/squashfs-root/oxespace"
            echo "OXESPACE_EXECUTABLE=$bin" >> "$GITHUB_ENV"
          fi
          node "$check" --app "$bin"
          cp "$bin" "$RUNNER_TEMP/oxespace.shipped"
          if [ "$OXESPACE_INSTALL_KIND" = deb ]; then
            sudo env "PATH=$PATH" npx --no-install @electron/fuses write --app "$bin" EnableNodeCliInspectArguments=on
          else
            npx --no-install @electron/fuses write --app "$bin" EnableNodeCliInspectArguments=on
          fi
          node "$check" --app "$bin" --test-copy-of "$RUNNER_TEMP/oxespace.shipped"
          echo "SHIPPED_BIN=$bin" >> "$GITHUB_ENV"

      - name: "Verify the upgrade"
        run: xvfb-run -a npx playwright test -c playwright.tools.config.ts "$SPEC"
        env:
          OXESPACE_UPGRADE_STEP: verify-upgrade
          OXESPACE_EXPECT_VERSION: ${{ env.CANDIDATE_VERSION }}

      # As on Windows: the binary exactly as shipped, started without Playwright on the upgraded profile, must still run
      # after 25 s with a window and log no error; it is quit the way the desktop does (SIGTERM), forced only after 10 s.
      - name: "The shipped binary runs on the upgraded profile without Playwright"
        run: |
          set -euo pipefail
          if [ "$OXESPACE_INSTALL_KIND" = deb ]; then sudo cp "$RUNNER_TEMP/oxespace.shipped" "$SHIPPED_BIN"; else cp "$RUNNER_TEMP/oxespace.shipped" "$SHIPPED_BIN"; fi
          node scripts/check-fuses.mjs --app "$SHIPPED_BIN"
          out=upgrade-state/shipped-exe && mkdir -p "$out"
          profile="$HOME/.config/OXESpace"; [ -d "$profile" ] || profile="$HOME/.config/oxespace"
          log="$profile/logs/main.log"
          skip=0; [ -f "$log" ] && skip=$(wc -l < "$log")
          Xvfb :97 -screen 0 1280x800x24 >/dev/null 2>&1 & xvfb=$!
          sleep 1
          args=(); [ "$OXESPACE_INSTALL_KIND" = appimage ] && args=(--no-sandbox)
          DISPLAY=:97 "$SHIPPED_BIN" "${args[@]}" >"$out/stdout.txt" 2>"$out/stderr.txt" & app=$!
          sleep 25
          alive=false; kill -0 "$app" 2>/dev/null && alive=true
          windows=$(DISPLAY=:97 xwininfo -root -tree 2>/dev/null | grep -i '"OXESpace"' || true)
          echo "alive after 25 s: $alive" | tee "$out/result.txt"
          echo "windows: ${windows:-none}" | tee -a "$out/result.txt"
          closer='already gone'
          if $alive; then
            kill -TERM "$app"; closer='SIGTERM'
            for _ in $(seq 1 20); do kill -0 "$app" 2>/dev/null || break; sleep 0.5; done
            if kill -0 "$app" 2>/dev/null; then kill -KILL "$app"; closer='forced after 10 s (SIGTERM did not quit the app)'; fi
          fi
          kill "$xvfb" 2>/dev/null || true
          echo "ended by: $closer" | tee -a "$out/result.txt"
          errors=0
          if [ -f "$log" ]; then
            cp "$log" "$out/main.log"
            tail -n +"$((skip + 1))" "$log" > "$out/main.this-launch.log"
            echo "--- main.log, this launch ---"; cat "$out/main.this-launch.log"; echo "--- end ---"
            errors=$(grep -c '\] \[error\] ' "$out/main.this-launch.log" || true)
            grep '\] \[error\] ' "$out/main.this-launch.log" | while read -r line; do echo "::error title=main.log::$line"; done || true
          else
            echo "no main.log under $profile" | tee -a "$out/result.txt"
          fi
          echo "error lines in main.log: $errors" | tee -a "$out/result.txt"
          $alive || { echo "::error::the shipped binary exited within 25 s on the upgraded profile"; exit 1; }
          [ -n "$windows" ] || { echo "::error::the shipped binary runs but shows no window after 25 s"; exit 1; }
          [ "$errors" -eq 0 ] || { echo "::error::main.log has $errors error line(s)"; exit 1; }

      # G8, as on Windows: back to the previous release, which must leave the upgraded database alone, then the
      # backup restored the way docs/ci-cd.md says, before the first start of the old version.
      - name: "Rollback: back to ${{ env.FROM_TAG }}"
        run: |
          set -euo pipefail
          if [ "$OXESPACE_INSTALL_KIND" = deb ]; then
            sudo apt-get install -y --allow-downgrades "$FROM_FILE"
          else
            echo "OXESPACE_EXECUTABLE=$FROM_FILE" >> "$GITHUB_ENV"
          fi

      - name: "Rollback: the previous release refuses the upgraded database"
        run: xvfb-run -a npx playwright test -c playwright.tools.config.ts "$SPEC"
        env:
          OXESPACE_UPGRADE_STEP: verify-refuse
          OXESPACE_EXPECT_VERSION: ${{ env.FROM_VERSION }}

      - name: "Rollback: restore the pre-upgrade backup"
        run: |
          set -euo pipefail
          data=$(node -p "require(process.env.OXESPACE_UPGRADE_STATE + '/seed.json').userData")
          pkill -f /opt/OXESpace/oxespace || true
          pkill -f AppImage || true
          from=$(node -p "require(process.env.OXESPACE_UPGRADE_STATE + '/seed.json').dbVersion")
          backup=$(ls -t "$data"/db-backups/oxespace-v"$from"-*.sqlite3 2>/dev/null | head -1 || true)
          if [ -z "$backup" ]; then
            # Skip only for the reason the upgrade check recorded; a moved schema with no backup is a failure here too.
            if ! node -e "process.exit(require(process.env.OXESPACE_UPGRADE_STATE + '/verify-upgrade.json').noMigration ? 0 : 1)"; then
              echo "::error::Schema moved but no oxespace-v$from backup in $data/db-backups"; exit 1
            fi
            echo "No oxespace-v$from backup: same schema on both releases, nothing to restore"; exit 0
          fi
          rm -f "$data/oxespace.sqlite3" "$data/oxespace.sqlite3-wal" "$data/oxespace.sqlite3-shm"
          cp "$backup" "$data/oxespace.sqlite3"
          echo "Restored $(basename "$backup") to $data/oxespace.sqlite3"

      - name: "Rollback: the previous release opens the restored data"
        run: xvfb-run -a npx playwright test -c playwright.tools.config.ts "$SPEC"
        env:
          OXESPACE_UPGRADE_STEP: verify-rollback
          OXESPACE_EXPECT_VERSION: ${{ env.FROM_VERSION }}

      - name: Uninstall (deb)
        if: matrix.kind == 'deb'
        run: sudo apt-get remove -y oxespace

      - name: "Verify the uninstall (deb)"
        if: matrix.kind == 'deb'
        run: xvfb-run -a npx playwright test -c playwright.tools.config.ts "$SPEC"
        env:
          OXESPACE_UPGRADE_STEP: verify-uninstall

      - name: Keep the state and the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-over-linux-x64-${{ matrix.kind }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            upgrade-state/
            test-results/
            playwright-report/
