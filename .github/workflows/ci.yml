name: CI and Release
# What each run is, in the Actions list (see docs/RELEASE_PIPELINE.md#run-names).
run-name: >-
  ${{ github.event_name == 'pull_request' && format('PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title)
  || startsWith(github.ref, 'refs/tags/') && format('Publish {0}', github.ref_name)
  || github.event_name == 'push' && format('Push · {0}', github.ref_name)
  || inputs.publish_release && format('Publish{0} · {1}', inputs.tag && format(' {0}', inputs.tag) || '', inputs.branch || github.ref_name)
  || inputs.packaged_smoke_only && format('Packaged smoke · {0}', inputs.branch || github.ref_name)
  || format('Full check · {0}', inputs.branch || github.ref_name) }}

# Unified pipeline:
#   1) build  — typecheck, test, build, e2e (+ package when releasing)
#   2) release — only after build succeeds; draft → verify → publish → confirm live
#
# Triggers:
#   - push/PR to main → build only
#   - push tag v*.*.* → build + release
#   - workflow_dispatch → choose branch; optional publish_release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      # Prefer GitHub's native "Use workflow from" branch. Only set this when you
      # need to build a *different* ref than the one selected in the UI.
      branch:
        description: Optional override — leave empty to use "Use workflow from"
        required: false
        type: string
      publish_release:
        description: After a successful build, package and publish a GitHub Release
        required: false
        default: false
        type: boolean
      tag:
        description: Optional release tag (vX.Y.Z). Empty = v{package.json version}
        required: false
        type: string
      packaged_smoke_only:
        description: Build the installer layout and run the packaged-app E2E on both platforms without publishing anything
        required: false
        default: false
        type: boolean

concurrency:
  # Only a pull request's run gives way to its next push. A run on main (or a tag) that started always finishes:
  # with a long runner queue, cancelling it on every merge meant main went untested for hours. Runs still waiting
  # in the group coalesce, so a burst of merges queues one run, not one per merge.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', inputs.branch || github.ref_name) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, test and build (${{ matrix.label }})
    # A draft PR runs nothing; marking it ready for review starts the run.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      # Never let a Linux failure cancel the Windows leg mid-release (or vice
      # versa) — a half-cancelled matrix leaves the release job with one payload.
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: windows-x64
            builder_flag: "--win"
            slim_platform: win32
          - os: ubuntu-22.04
            label: linux-x64
            builder_flag: "--linux"
            slim_platform: linux
    # NOTE: with a matrix, a job output is whichever leg wrote it last. Every
    # value below is derived purely from package.json + the git ref, so both legs
    # compute identical values and the race is benign.
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      manifest: ${{ steps.plan.outputs.manifest }}
      manifest_linux: ${{ steps.plan.outputs.manifest_linux }}
      sha: ${{ steps.plan.outputs.sha }}

    steps:
      - name: Resolve checkout ref
        id: ref
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Manual runs: GitHub "Use workflow from" is github.ref_name.
          # Optional inputs.branch overrides that when non-empty.
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $override = '${{ inputs.branch }}'.Trim()
            $ref = if ($override) { $override } else { '${{ github.ref_name }}' }
            if ([string]::IsNullOrWhiteSpace($ref)) {
              throw 'workflow_dispatch could not resolve a branch (set Use workflow from, or branch input).'
            }
          } else {
            $ref = '${{ github.ref }}'
          }
          "ref=$ref" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Checkout ref: $ref"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - name: Plan build vs release
        id: plan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          $sha = git rev-parse HEAD
          $event = '${{ github.event_name }}'
          $publishInput = '${{ inputs.publish_release }}'
          $tagInput = '${{ inputs.tag }}'.Trim()

          $shouldRelease = $false
          $tag = $null

          if ($event -eq 'push' -and $env:GITHUB_REF.StartsWith('refs/tags/v')) {
            $shouldRelease = $true
            $tag = $env:GITHUB_REF_NAME
          } elseif ($event -eq 'workflow_dispatch' -and $publishInput -eq 'true') {
            $shouldRelease = $true
            $tag = if ($tagInput) { $tagInput } else { "v$version" }
          }

          if ($shouldRelease) {
            if ($tag -ne "v$version") {
              throw "Release tag $tag does not match package.json version $version."
            }
            # Tag may be created later by the release job when dispatching from a branch.
            # `show-ref --quiet` reports "absent" with exit 1. That is a normal
            # answer here, not a failure — but it leaves $LASTEXITCODE at 1, and
            # every statement after this point is a PowerShell cmdlet that does
            # not reset it, so pwsh exits 1 and fails the step even though the
            # plan succeeded. Capture the answer, then clear the code.
            git show-ref --verify --quiet "refs/tags/$tag"
            $tagExists = $LASTEXITCODE -eq 0
            $global:LASTEXITCODE = 0
            if ($tagExists) {
              $tagCommit = git rev-list -n 1 $tag
              if ($sha -ne $tagCommit) {
                throw "Checked-out commit $sha does not match tag $tag ($tagCommit)."
              }
            } elseif ($event -ne 'workflow_dispatch') {
              throw "$tag is not an existing Git tag."
            }
          }

          $channel = if ($version -match '-([a-z]+)(?:[.-]|$)') { $Matches[1].ToLowerInvariant() } else { 'latest' }
          $isPrerelease = $channel -ne 'latest'

          # A stable release is a commit on main: release branches reach main through their PR first,
          # so main always holds what was last published. Prereleases may come from any branch.
          if ($shouldRelease -and -not $isPrerelease) {
            git merge-base --is-ancestor $sha origin/main
            $onMain = $LASTEXITCODE -eq 0
            $global:LASTEXITCODE = 0
            if (-not $onMain) {
              throw "$tag is a stable release, and $sha is not on main. Merge the release PR into main, then publish from main."
            }
          }

          "should_release=$($shouldRelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          # Package and run the packaged-app E2E without any publishing step (the release job only reads should_release).
          $packagedSmoke = $event -eq 'workflow_dispatch' -and '${{ inputs.packaged_smoke_only }}' -eq 'true' -and -not $shouldRelease
          "packaged_smoke=$($packagedSmoke.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$($isPrerelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "manifest=$channel.yml" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          # electron-updater writes a per-OS manifest on Linux.
          "manifest_linux=$channel-linux.yml" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          Write-Host "version=$version tag=$tag should_release=$shouldRelease sha=$sha"

      - name: Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      # Electron links against the GTK/NSS desktop stack, and Chromium cannot
      # start headless without a display server — xvfb provides one for the E2E
      # smoke. The Windows runner needs none of this.
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2 \
            libxshmfence1 libnotify4

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm run security:audit

      - name: Audit build tools for high and critical advisories
        run: npm run security:audit:tools

      # The OxeQuery worker compiles its database drivers in; they are
      # devDependencies, so the production audit and SBOM above never see them.
      - name: Audit bundled runtime packages
        run: npm run security:audit:bundled

      - name: Check third-party notices and bundled licenses
        run: npm run notices:check

      - name: Verify Electron support window
        run: node scripts/check-runtime-support.mjs

      - name: Install the pinned Electron runtime
        run: npm rebuild electron

      - name: Type check
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run typecheck

      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Unit and integration tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run rebuild:native:node
          # Git/worktree integration tests contend for process and filesystem
          # resources on Windows when Vitest runs files concurrently.
          npm run test:coverage

      - name: Build renderer and main process
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run build
          # Installed apps have no node_modules above them; tests inside the checkout do. 1.0.0 shipped an
          # OxeQuery worker that imported a devDependency and could not load on any installed build.
          node scripts/check-bundle-imports.mjs

      # The main process ships minified; its source maps never ship. Keep them with the run, so a stack from a
      # problem report of this build can be read: node scripts/symbolicate-stack.mjs --maps <artifact folder>.
      - name: Upload main-process source maps
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: main-sourcemaps-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 90
          path: out/main/**/*.map

      # E2E launches Electron, so it must run only after the Electron-native
      # binary has been installed and verified. node-pty supplies a
      # N-API-compatible prebuild; rebuilding it would unnecessarily require
      # a C++ toolchain on every runner.
      - name: Prepare and verify native modules for Electron
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run fix:native
          npm run verify:native

      # A database written by the last stable release (its own migration code, read from its git tag) is filled
      # with data, upgraded by this build under the Electron runtime, and taken back: the old release must refuse
      # the upgraded file untouched and open the verified backup. OXESPACE_UPGRADE_FROM picks another release.
      - name: Upgrade rehearsal (previous stable database, forward and back)
        shell: pwsh
        env:
          OXESPACE_REQUIRE_UPGRADE_TAG: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run test:electron -- tests/integration/upgrade-rehearsal.native.test.ts

      # OxeQuery carries its own floor: unit, component and integration tests together cover at least 60%.
      - name: OxeQuery coverage gate
        shell: bash
        run: npm run test:coverage:oxequery

      - name: E2E smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run test:e2e -- --trace retain-on-failure

      - name: Upload E2E traces (Windows failures)
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces-windows
          if-no-files-found: ignore
          retention-days: 7
          path: test-results/**/trace.zip

      # Electron needs a display; the wrapper owns a private Xvfb lifecycle so
      # repeated Playwright launches cannot leave the CI job waiting on Xvfb.
      - name: E2E smoke (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/run-with-xvfb.sh npm run test:e2e -- --trace retain-on-failure

      - name: Upload E2E traces (Linux failures)
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces-linux
          if-no-files-found: ignore
          retention-days: 7
          path: test-results/**/trace.zip

      - name: E2E performance gate (Linux)
        if: runner.os == 'Linux'
        env:
          OXESPACE_PERF_GATE: "1"
        run: bash scripts/run-with-xvfb.sh npm run bench:ui

      # Same budgets on the platform that actually ships today. Baselined on an
      # idle host at 15/15 with the tightest headroom on boot
      # (firstWindow→interactive 525ms against 2000ms); Linux clears the same
      # budgets from the container. Both legs are hard gates, so a budget miss
      # is a finding on one platform even when the other still fits.
      - name: E2E performance gate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OXESPACE_PERF_GATE: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run bench:ui

      # Performance regression visibility. Informational for now (the CPU
      # micro-benchmarks are deterministic); promote to a hard gate once we
      # baseline thresholds. The full runtime-fluidity harness lives in
      # e2e/perf-benchmark.spec.ts for local/manual runs.
      - name: Performance benchmark (informational)
        if: steps.plan.outputs.should_release != 'true'
        continue-on-error: true
        run: npx vitest bench --run tests/bench/hotpaths.bench.ts

      # @xenova/transformers imports sharp when the optional semantic index loads.
      # npm ci --ignore-scripts leaves the sharp native binary missing; rebuild it
      # (N-API, so the Node build also loads under Electron) before packaging.
      - name: Install sharp native bindings
        if: (steps.plan.outputs.should_release == 'true' || steps.plan.outputs.packaged_smoke == 'true')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm rebuild sharp

      - name: Package installer (${{ matrix.label }})
        if: (steps.plan.outputs.should_release == 'true' || steps.plan.outputs.packaged_smoke == 'true')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # build + fix:native already ran above; only slim and package. The
          # semantic model is not bundled (downloaded on demand into userData).
          # slim:pack keeps ONLY the target's ONNX prebuild; passing the target
          # explicitly matters because it is what a Linux build needs to KEEP.
          node scripts/slim-pack-deps.mjs --platform=${{ matrix.slim_platform }} --arch=x64
          # GitHub publish configuration does not infer the update channel from
          # prerelease versions. Set it explicitly so beta builds emit beta.yml
          # (and beta-linux.yml) instead of overwriting the stable latest feed.
          npx electron-builder ${{ matrix.builder_flag }} --config.npmRebuild=false --config.publish.channel=${{ steps.plan.outputs.channel }} --publish never
          # Installer size in every run log, so a dependency that bloats the package shows up in review.
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.deb', '.AppImage' } |
            ForEach-Object { '[installer-size] {0} {1:N1} MB' -f $_.Name, ($_.Length / 1MB) }
          # The source maps are private: none may reach the packaged app.
          node -e "const asar = require('@electron/asar'); const fs = require('node:fs'); const dirs = fs.readdirSync('dist').filter(name => name.endsWith('-unpacked')); if (!dirs.length) throw new Error('no unpacked app in dist'); for (const dir of dirs) { const maps = asar.listPackage('dist/' + dir + '/resources/app.asar', {}).filter(file => /^[\\/]out[\\/].*\.map$/.test(file)); if (maps.length) throw new Error(dir + ' ships source maps: ' + maps.slice(0, 5).join(', ')); console.log('[sourcemaps] ' + dir + ': none in app.asar') }"

      - name: E2E packaged Linux build
        if: (steps.plan.outputs.should_release == 'true' || steps.plan.outputs.packaged_smoke == 'true') && runner.os == 'Linux'
        shell: bash
        run: |
          # Run a copy outside the checkout, like /opt/OXESpace: inside it, Node resolves missing packages from
          # the repository's node_modules and hides packaging bugs.
          rm -rf "$RUNNER_TEMP/oxespace-installed"
          cp -a "$GITHUB_WORKSPACE/dist/linux-unpacked" "$RUNNER_TEMP/oxespace-installed"
          executable="$(find "$RUNNER_TEMP/oxespace-installed" -maxdepth 1 -type f -perm -u+x -iname 'oxespace*' -print -quit)"
          if [[ -z "$executable" ]]; then
            echo "No packaged OXESpace executable found in dist/linux-unpacked." >&2
            exit 1
          fi
          OXESPACE_PACKAGED_EXECUTABLE="$executable" \
            bash scripts/run-with-xvfb.sh \
            npx playwright test --config playwright.tools.config.ts packaged-linux.spec.ts


      # Guards a bug that shipped in v0.7.0. electron-builder's stock postinst
      # decides chrome-sandbox's mode by probing `unshare --user true` — but
      # postinst runs as root, which is exempt from the unprivileged-userns
      # restriction Ubuntu 24.04 enables. The probe therefore reported
      # "namespaces work", chose 0755, and every 24.04 user got an app that
      # aborted at launch. A runtime test cannot catch this here: the runner is
      # 22.04, where the probe happens to be right. So assert on the package
      # instead, which is deterministic on any host.
      - name: Verify the .deb secures the chrome-sandbox helper
        if: steps.plan.outputs.should_release == 'true' && runner.os == 'Linux'
        run: |
          set -euo pipefail
          deb=$(ls dist/*.deb)
          # Assert on what the script RUNS, so strip comments first: our own
          # postinst quotes the stock probe while explaining why it is wrong,
          # and matching that text would fail on the very fix it documents.
          code=$(dpkg-deb --info "$deb" postinst | sed -e 's/#.*$//')
          if ! grep -qF "chmod 4755 '/opt/OXESpace/chrome-sandbox'" <<<"$code"; then
            echo "postinst does not unconditionally setuid chrome-sandbox:" >&2
            dpkg-deb --info "$deb" postinst >&2
            exit 1
          fi
          if grep -qF 'unshare --user' <<<"$code"; then
            echo "postinst still probes user namespaces — the stock template is back." >&2
            dpkg-deb --info "$deb" postinst >&2
            exit 1
          fi
          echo "OK: chrome-sandbox is setuid root unconditionally."

      # The NSIS build is what ships today, yet it was the one packaged output
      # CI never launched. Runs against win-unpacked (the same tree the
      # installer writes) so a broken asarUnpack or extraResource fails here
      # rather than on a user's machine.
      - name: E2E packaged Windows build
        if: (steps.plan.outputs.should_release == 'true' || steps.plan.outputs.packaged_smoke == 'true') && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # Run a copy outside the checkout, like Program Files: inside it, Node resolves missing packages
          # from the repository's node_modules and hides packaging bugs.
          $installed = Join-Path $env:RUNNER_TEMP 'oxespace-installed'
          if (Test-Path $installed) { Remove-Item -Recurse -Force $installed }
          Copy-Item -Recurse "$env:GITHUB_WORKSPACE/dist/win-unpacked" $installed
          $executable = Get-ChildItem $installed -Filter 'OXESpace*.exe' -File |
            Select-Object -First 1
          if (-not $executable) {
            throw 'No packaged OXESpace executable found in dist/win-unpacked.'
          }
          $env:OXESPACE_PACKAGED_EXECUTABLE = $executable.FullName
          npx playwright test --config playwright.tools.config.ts packaged-win.spec.ts

      - name: Generate production dependency SBOM
        if: steps.plan.outputs.should_release == 'true'
        shell: pwsh
        run: npm sbom --sbom-format spdx --omit dev | Out-File -FilePath dist/sbom.spdx.json -Encoding utf8

      - name: Generate and validate release artifacts
        if: steps.plan.outputs.should_release == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/release-checksums.mjs --output dist/SHA256SUMS.txt
          node scripts/verify-release-artifacts.mjs `
            --dir dist `
            --version "${{ steps.plan.outputs.version }}" `
            --tag "$env:RELEASE_TAG" `
            --platform ${{ runner.os == 'Windows' && 'win' || 'linux' }}

      # Each leg uploads only its own payload; the release job merges them. The
      # per-leg SHA256SUMS/sbom are namespaced so the two downloads cannot
      # silently overwrite each other.
      - name: Namespace the per-platform aux files
        if: steps.plan.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Move-Item dist/SHA256SUMS.txt "dist/SHA256SUMS-${{ matrix.label }}.txt" -Force
          Move-Item dist/sbom.spdx.json "dist/sbom-${{ matrix.label }}.spdx.json" -Force

      - name: Upload immutable release payload (Windows)
        if: steps.plan.outputs.should_release == 'true' && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.plan.outputs.version }}-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/OXESpace-${{ steps.plan.outputs.version }}-x64.exe
            dist/OXESpace-${{ steps.plan.outputs.version }}-x64.exe.blockmap
            dist/*.yml
            dist/sbom-${{ matrix.label }}.spdx.json
            dist/SHA256SUMS-${{ matrix.label }}.txt

      - name: Upload immutable release payload (Linux)
        if: steps.plan.outputs.should_release == 'true' && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.plan.outputs.version }}-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 30
          # The .deb filename is glob-matched: electron-builder renders ${arch}
          # as the Debian arch (amd64), not the electron arch (x64).
          path: |
            dist/OXESpace-${{ steps.plan.outputs.version }}-x64.AppImage
            dist/*.deb
            dist/*.yml
            dist/sbom-${{ matrix.label }}.spdx.json
            dist/SHA256SUMS-${{ matrix.label }}.txt

  # OxeQuery against real PostgreSQL, MongoDB, an SSH server and TLS. Ubuntu runners
  # ship Docker; the tests start and remove their own containers. This is a release
  # gate: a database client that was only ever tested against mocks must not ship.
  oxequery-live:
    name: OxeQuery live tests (${{ matrix.engine }}; PostgreSQL, MongoDB, SSH, TLS)
    # A draft PR runs nothing; marking it ready for review starts the run.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # The same suite against each container engine a person may have.
        engine: [docker, podman]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - name: Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build native modules for Node
        run: npm run rebuild:native:node

      # tests/live/oxequery-live.test.ts drives the real worker bundle.
      - name: Build the main process and worker
        run: npx electron-vite build

      - name: Pull the images the tests use
        run: |
          ${{ matrix.engine }} --version
          ${{ matrix.engine }} pull docker.io/library/postgres:16-alpine
          ${{ matrix.engine }} pull docker.io/library/mongo:7
          ${{ matrix.engine }} pull docker.io/library/alpine:3.20

      - name: Live tests
        env:
          OXE_LIVE: "1"
          OXE_CONTAINER_ENGINE: ${{ matrix.engine }}
        run: npx vitest run tests/live/oxequery-live.test.ts tests/live/oxequery-connectivity-live.test.ts tests/live/oxequery-writes-live.test.ts

  # The same suite against the server versions people actually run: the oldest and the newest
  # supported PostgreSQL (12, 17) and MongoDB (5, 8), plus the middle ones. Docker only; the
  # engine matrix above already covers Podman against the default versions.
  oxequery-live-versions:
    name: OxeQuery live tests (PostgreSQL ${{ matrix.pg }}, MongoDB ${{ matrix.mongo }})
    # A draft PR runs nothing; marking it ready for review starts the run.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pg: "12-alpine", mongo: "5.0" }
          - { pg: "14-alpine", mongo: "6.0" }
          - { pg: "17-alpine", mongo: "8.0" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - name: Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build native modules for Node
        run: npm run rebuild:native:node

      - name: Build the main process and worker
        run: npx electron-vite build

      # MongoDB 8.x refuses to start on Linux 6.19+ (TCMalloc vs the kernel's rseq,
      # SERVER-121912, no fixed release yet), and runners now come with either kernel.
      # On a 6.19+ runner the 8.x leg runs on 7.0 and says so; older kernels keep 8.x.
      - name: Choose the MongoDB image for this runner's kernel
        id: mongo
        run: |
          mongo="${{ matrix.mongo }}"
          kernel="$(uname -r | cut -d- -f1)"
          if [ "${mongo%%.*}" -ge 8 ] && [ "$(printf '6.19\n%s\n' "$kernel" | sort -V | head -1)" = "6.19" ]; then
            echo "::notice title=MongoDB ${mongo} skipped::Linux ${kernel} cannot run MongoDB 8.x (SERVER-121912); this leg uses MongoDB 7.0."
            mongo="7.0"
          fi
          echo "image=docker.io/library/mongo:${mongo}" >> "$GITHUB_OUTPUT"

      - name: Pull the images the tests use
        run: |
          docker pull docker.io/library/postgres:${{ matrix.pg }}
          docker pull ${{ steps.mongo.outputs.image }}
          docker pull docker.io/library/postgres:16-alpine
          docker pull docker.io/library/alpine:3.20

      - name: Live tests
        env:
          OXE_LIVE: "1"
          OXE_CONTAINER_ENGINE: docker
          OXE_LIVE_PG_IMAGE: docker.io/library/postgres:${{ matrix.pg }}
          OXE_LIVE_MONGO_IMAGE: ${{ steps.mongo.outputs.image }}
        run: npx vitest run tests/live/oxequery-live.test.ts tests/live/oxequery-connectivity-live.test.ts tests/live/oxequery-writes-live.test.ts

  # Native AI Memory contracts (Windows/Linux x 2.1.0/2.6.2). PRs run the
  # path-filtered standalone workflow instead; main, tags and dispatch always gate here.
  memory-compatibility:
    name: Memory compatibility
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/memory-compatibility.yml

  release:
    name: Publish GitHub Release
    needs: [build, oxequery-live, oxequery-live-versions, memory-compatibility]
    if: needs.build.outputs.should_release == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
      # Build provenance: GitHub signs a statement that these files came from this workflow run.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          # Need a writable checkout so we can create the release tag when
          # publishing from a branch that does not yet have vX.Y.Z.
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0

      - name: Ensure release tag points at the verified build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          BUILD_SHA: ${{ needs.build.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          # An annotated tag records a tagger, and a fresh runner has no git
          # identity — `git tag -a` aborts with "unable to auto-detect email".
          # Attribute it to the Actions bot rather than impersonating whoever
          # authored the commit being released.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --tags --force origin
          # An absent tag is the normal answer when publishing from a branch, so
          # probe before native failures become terminal below.
          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          $tagExists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          # From here every git call must stop the step at the point it fails.
          # Without this, a failed `git tag` fell through to `git push`, which
          # then reported the misleading "src refspec does not match any".
          $PSNativeCommandUseErrorActionPreference = $true
          if ($tagExists) {
            $tagCommit = git rev-list -n 1 $env:RELEASE_TAG
            if ($tagCommit -ne $env:BUILD_SHA) {
              throw "Tag $env:RELEASE_TAG points at $tagCommit but build verified $env:BUILD_SHA."
            }
            Write-Host "Tag $env:RELEASE_TAG already points at verified build $env:BUILD_SHA."
          } else {
            Write-Host "Creating tag $env:RELEASE_TAG at $env:BUILD_SHA"
            git tag -a $env:RELEASE_TAG $env:BUILD_SHA -m "OXESpace $env:RELEASE_TAG"
            git push origin "refs/tags/$env:RELEASE_TAG"
          }

      # Both legs land in the same dist/ — their filenames are disjoint (the aux
      # files were namespaced by the build job), so nothing is overwritten.
      - name: Download verified Windows build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.version }}-windows-x64
          path: dist

      - name: Download verified Linux build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.version }}-linux-x64
          path: dist

      # One checksum file covering the whole release rather than one per OS, so
      # a user verifying any download reads a single canonical list.
      - name: Generate combined checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item dist/SHA256SUMS-*.txt -Force
          node scripts/release-checksums.mjs --output dist/SHA256SUMS.txt

      # Anyone can check where a download came from with
      # `gh attestation verify <file> --repo propagno/oxespace` (docs/RELEASE_PIPELINE.md).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/OXESpace-${{ needs.build.outputs.version }}-x64.exe
            dist/OXESpace-${{ needs.build.outputs.version }}-x64.AppImage
            dist/*.deb
            dist/SHA256SUMS.txt

      - name: Create or refresh draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.build.outputs.version }}'
          $manifest = '${{ needs.build.outputs.manifest }}'
          $manifestLinux = '${{ needs.build.outputs.manifest_linux }}'
          $deb = Get-ChildItem dist/*.deb | Select-Object -First 1
          if (-not $deb) { throw 'No .deb produced by the Linux build.' }
          $assets = @(
            "dist/OXESpace-$version-x64.exe",
            "dist/OXESpace-$version-x64.exe.blockmap",
            "dist/$manifest",
            "dist/OXESpace-$version-x64.AppImage",
            $deb.FullName,
            "dist/$manifestLinux",
            'dist/sbom-windows-x64.spdx.json',
            'dist/sbom-linux-x64.spdx.json',
            'dist/SHA256SUMS.txt'
          )
          foreach ($path in $assets) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing release asset after download: $path"
            }
          }

          gh release view $env:RELEASE_TAG 2>$null
          $notesPath = "docs/releases/$version.md"
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG --clobber @assets
            gh release edit $env:RELEASE_TAG --draft=true
            if (Test-Path -LiteralPath $notesPath) { gh release edit $env:RELEASE_TAG --notes-file $notesPath }
          } else {
            $createArgs = @(
              'release', 'create', $env:RELEASE_TAG,
              '--draft',
              '--title', "OXESpace $env:RELEASE_TAG",
              '--target', '${{ needs.build.outputs.sha }}'
            )
            if (Test-Path -LiteralPath $notesPath) { $createArgs += @('--notes-file', $notesPath) }
            else { $createArgs += '--generate-notes' }
            if ('${{ needs.build.outputs.prerelease }}' -eq 'true') { $createArgs += '--prerelease' }
            $createArgs += $assets
            gh @createArgs
          }

      - name: Download draft and verify the published payload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $downloadDir = Join-Path $env:RUNNER_TEMP 'release-download'
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
          gh release download $env:RELEASE_TAG --dir $downloadDir --clobber
          foreach ($platform in @('win', 'linux')) {
            node scripts/verify-release-artifacts.mjs `
              --dir $downloadDir `
              --version '${{ needs.build.outputs.version }}' `
              --tag $env:RELEASE_TAG `
              --platform $platform
            if ($LASTEXITCODE -ne 0) { throw "Release payload verification failed for $platform." }
          }

      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release edit $env:RELEASE_TAG --draft=false
          if ('${{ needs.build.outputs.prerelease }}' -eq 'true') {
            gh release edit $env:RELEASE_TAG --prerelease
          }

      - name: Confirm release is live
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $json = gh release view $env:RELEASE_TAG --json isDraft,isPrerelease,tagName,url,assets
          if ($LASTEXITCODE -ne 0) { throw "Failed to query release $env:RELEASE_TAG" }
          $release = $json | ConvertFrom-Json
          if ($release.isDraft) {
            throw "Release $env:RELEASE_TAG is still draft after publish."
          }
          $expectedPrerelease = '${{ needs.build.outputs.prerelease }}' -eq 'true'
          if ([bool]$release.isPrerelease -ne $expectedPrerelease) {
            throw "Release prerelease flag mismatch for $env:RELEASE_TAG (got $($release.isPrerelease), expected $expectedPrerelease)."
          }
          if ($release.tagName -ne $env:RELEASE_TAG) {
            throw "Release tagName $($release.tagName) does not match $env:RELEASE_TAG."
          }
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          $required = @(
            "OXESpace-${{ needs.build.outputs.version }}-x64.exe",
            "OXESpace-${{ needs.build.outputs.version }}-x64.exe.blockmap",
            '${{ needs.build.outputs.manifest }}',
            "OXESpace-${{ needs.build.outputs.version }}-x64.AppImage",
            '${{ needs.build.outputs.manifest_linux }}',
            'sbom-windows-x64.spdx.json',
            'sbom-linux-x64.spdx.json',
            'SHA256SUMS.txt'
          )
          $missing = $required | Where-Object { $_ -notin $assetNames }
          if ($missing.Count -gt 0) {
            throw "Published release is missing asset(s): $($missing -join ', ')"
          }
          $debAssets = @($assetNames | Where-Object { $_ -match '\.deb$' })
          if ($debAssets.Count -ne 1) {
            throw "Published release must contain exactly one .deb; found $($debAssets.Count): $($debAssets -join ', ')"
          }
          Write-Host "Release is live: $($release.url)"
          Write-Host "Assets: $($assetNames -join ', ')"
