name: CI
# What each run is, in the Actions list (see docs/RELEASE_PIPELINE.md#run-names).
run-name: >-
  ${{ github.event_name == 'pull_request' && format('PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title)
  || github.event_name == 'push' && format('Push · {0}', github.ref_name)
  || inputs.packaged_smoke_only && format('Packaged smoke · {0}', inputs.branch || github.ref_name)
  || format('Full check · {0}', inputs.branch || github.ref_name) }}

# Canonical CI pipeline (OXE-434): read-only verification (no release publishing or write tokens).
# Release packaging and publishing live in .github/workflows/release.yml (which calls this workflow).
#   1) changes — classifies PR paths and pins the single commit SHA every job checks out
#   2) quick (fast-gate, <2m) — typecheck, lint, fast guardrail tests, notices, audits; gates PR fan-out
#   3) build (Windows, Linux) — compiles out/ ONCE per OS (bundle budgets + import check + sourcemaps)
#      unit-shard (5 Windows / 4 Linux) → unit (coverage merge + floors)
#   4) brand-conformance (Windows, Linux, enforced — never masked)
#      e2e-impacted (Linux, PRs only — targeted smoke + acceptance via scripts/related-e2e.mjs)
#      e2e (Windows, Linux, 4 shards each — main, dispatches, workflow_call) + perf-plan/perf-recheck
#      a11y (Windows, Linux), oxequery-live (Docker/Podman + DB versions)
#   5) package (Windows, Linux — packaged_smoke_only only) → ci-result ("CI result") → wake-merge-train

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      branch:
        description: Optional override — leave empty to use "Use workflow from"
        required: false
        type: string
      packaged_smoke_only:
        description: Build the installer layout and run the packaged-app E2E on both platforms without publishing anything
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      branch:
        description: Optional ref (commit SHA, tag, or branch) to verify
        required: false
        default: ""
        type: string
      packaged_smoke_only:
        description: Build installers and run packaged-app E2E on both platforms without publishing
        required: false
        default: false
        type: boolean
      strict_perf_gate:
        description: Fail e2e directly on a performance gate miss instead of soft recheck (used by release.yml)
        required: false
        default: false
        type: boolean
    outputs:
      sha:
        description: Verified commit SHA
        value: ${{ jobs.changes.outputs.sha }}
      version:
        description: package.json version on the verified commit
        value: ${{ jobs.quick.outputs.version }}

concurrency:
  group: >-
    ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call')
    && format('dispatch-{0}', inputs.branch || github.ref_name) || github.ref }}${{ github.event.pull_request.draft && '-draft' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Performance gate failures accepted outside a release (OXE-389; scripts/perf-gate-outcome.mjs).
  PERF_GATE_KNOWN_FAILURES: '[]'

jobs:
  changes:
    name: Changed paths
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      oxequery: ${{ steps.classify.outputs.oxequery }}
      a11y: ${{ steps.classify.outputs.a11y }}
      deps: ${{ steps.classify.outputs.deps }}
      nondoc: ${{ steps.classify.outputs.nondoc }}
      base: ${{ steps.classify.outputs.base }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Resolve the commit every job checks out
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          INPUT_BRANCH: ${{ inputs.branch }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ref="$(printf '%s' "$INPUT_BRANCH" | tr -d '[:space:]')"
          if [ -n "$ref" ]; then
            sha=$(gh api "repos/$REPO/commits/$ref" --jq .sha)
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            [ -n "$REF_NAME" ] || { echo "Could not resolve a ref (set Use workflow from, or branch input)." >&2; exit 1; }
            sha=$(gh api "repos/$REPO/commits/$REF_NAME" --jq .sha)
          else
            sha="$EVENT_SHA"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "checkout: $sha"

      - name: Classify the changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ steps.commit.outputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          manifests='^(package\.json|package-lock\.json|mobile/.*\.gradle(\.kts)?|mobile/.*libs\.versions\.toml|\.github/(workflows|actions)/.*)$'
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "oxequery=true" >> "$GITHUB_OUTPUT"; echo "a11y=true" >> "$GITHUB_OUTPUT"
            deps=false; base=
            compare=$(gh api "repos/$REPO/compare/$DEFAULT_BRANCH...$SHA" --jq '{base: .merge_base_commit.sha, ahead: .ahead_by, files: [.files[]?.filename]}')
            if [ "$(echo "$compare" | jq .ahead)" != "0" ]; then
              base=$(echo "$compare" | jq -r .base)
              if [ "$(echo "$compare" | jq '.files | length')" -ge 300 ] || grep -Eq "$manifests" <<<"$(echo "$compare" | jq -r '.files[]')"; then deps=true; fi
            fi
            echo "deps=$deps" >> "$GITHUB_OUTPUT"; echo "base=$base" >> "$GITHUB_OUTPUT"
            echo "not a pull request: everything runs; dependency review: $deps"; exit 0
          fi
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          echo "$files" | sed 's/^/  /'
          code=false; oxequery=false; a11y=false
          if grep -Eqv '^(docs/|\.claude/|.*\.md$)' <<<"$files"; then code=true; fi
          nondoc=$(grep -Evc '^(docs/|\.claude/|.*\.md$)' <<<"$files" || true)
          echo "nondoc=$nondoc" >> "$GITHUB_OUTPUT"
          if grep -Eqv '^(docs/|\.claude/|.*\.md$|electron/main/.*\.test\.ts$|tests/|mobile/|scripts/android/|shared/remote/|\.github/workflows/(android|nightly|visual|manual-ops|jira-sync|merge-train)\.yml$)' <<<"$files"; then a11y=true; fi
          if grep -Eq '^(electron/main/services/(oxequery|oxepod)/|electron/main/workers/[^/]*oxequery|shared/[^/]*oxequery|shared/types/[^/]*oxequery|shared/(sqlText|mongoQueryText)\.ts$|tests/live/|tests/([^/]+/)?[^/]*oxequery|scripts/[^/]*oxequery|\.github/workflows/ci\.yml$)' <<<"$files"; then oxequery=true; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"; echo "oxequery=$oxequery" >> "$GITHUB_OUTPUT"; echo "a11y=$a11y" >> "$GITHUB_OUTPUT"
          deps=false; if grep -Eq "$manifests" <<<"$files"; then deps=true; fi
          echo "deps=$deps" >> "$GITHUB_OUTPUT"
          echo "code=$code oxequery=$oxequery a11y=$a11y deps=$deps (files: $(wc -l <<<"$files"), not docs: $nondoc)"

  dependency-review:
    name: Dependency review
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event_name != 'pull_request' && needs.changes.outputs.base || '' }}
          head-ref: ${{ github.event_name != 'pull_request' && needs.changes.outputs.sha || '' }}
          fail-on-severity: high

  check-origin:
    name: Check commit origin
    needs: changes
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
          path: repo
          persist-credentials: false

      - name: Checkout oxe-cc (1.22.0)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: propagno/oxe-build
          ref: f9508df6d6b257bc9b48ffe3985696a48a8fe7e3 # release/1.22.0
          path: oxe-build
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Check commit origin trailers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/check-origin.json"
          ctx="$RUNNER_TEMP/origin-ctx"
          mkdir -p "$ctx"
          set +e
          GIT_CEILING_DIRECTORIES="$RUNNER_TEMP" node oxe-build/bin/oxe-cc.js ship check-origin "$PR_NUMBER" \
            --dir "$ctx" --config "$PWD/repo/oxe.config.json" --json > "$out"
          status=$?
          set -e
          cat "$out"
          node - "$out" "$status" <<'EOF'
          const fs = require('fs')
          const [file, rawStatus] = process.argv.slice(2)
          const status = Number(rawStatus)
          let report = null
          try { report = JSON.parse(fs.readFileSync(file, 'utf8')) } catch {}
          if (!report) {
            console.log(`::error title=Check commit origin failed::oxe-cc exited ${status} without JSON output`)
            process.exit(status || 1)
          }
          for (const p of report.config_problems || []) console.log(`::error title=Invalid origin config::${p}`)
          for (const v of report.violations || []) {
            const sha = String(v.sha || '').slice(0, 12)
            console.log(`::error title=Commit missing origin (${sha})::${sha} ${v.subject || ''} — ${v.reason || 'missing OXE-Task+OXE-Run or OXE-Quick+OXE-Card'}`)
          }
          if (!report.ok || status !== 0) process.exit(1)
          console.log(`Origin verified for ${report.commits} commit(s) in PR #${report.pr}`)
          EOF

  # Stage 1 (fast-gate, <2 min): keeps exact job display name "Quick checks (linux-x64)" read by scripts/pr-ready.mjs.
  quick:
    name: Quick checks (linux-x64)
    needs: [changes]
    if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      packaged_smoke: ${{ steps.plan.outputs.packaged_smoke }}
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
          fetch-depth: 1

      - name: Plan CI run
        id: plan
        shell: bash
        env:
          INPUT_PACKAGED_SMOKE_ONLY: ${{ inputs.packaged_smoke_only }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          sha=$(git rev-parse HEAD)
          channel=$(node -p "const m = /-([a-z]+)(?:[.-]|$)/i.exec(process.argv[1]); m ? m[1].toLowerCase() : 'latest'" "$version")
          packaged_smoke=false
          if [ "$INPUT_PACKAGED_SMOKE_ONLY" = "true" ]; then
            packaged_smoke=true
          fi
          {
            echo "packaged_smoke=$packaged_smoke"
            echo "version=$version"
            echo "channel=$channel"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version channel=$channel packaged_smoke=$packaged_smoke sha=$sha"

      - name: Setup OXESpace
        uses: ./.github/actions/setup-oxespace

      - name: Type check
        run: npm run typecheck

      - name: Lint (file sizes & eslint)
        run: npm run lint

      - name: Fast guardrail tests
        run: >-
          npx vitest run
          tests/unit/workflow-governance.test.ts
          tests/unit/css-classes-guard.test.ts
          tests/design-lint.test.ts
          tests/design-lint-target-size.test.ts
          tests/i18n-catalog.test.ts
          tests/unit/migration-numbering.test.ts
          --maxWorkers=1 --testTimeout=15000

      - name: Check third-party notices and bundled licenses
        run: npm run notices:check

      - name: Verify Electron support window
        run: node scripts/check-runtime-support.mjs

      - name: Audit production, build-tool, and bundled dependencies
        run: |
          set -euo pipefail
          npm run security:audit
          npm run security:audit:tools
          npm run security:audit:bundled

  build:
    name: Build (${{ matrix.label }})
    needs: [changes, quick]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.quick.result == 'success' && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x64, os: ubuntu-22.04 }
          - { label: windows-x64, os: windows-2022 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
          fetch-depth: 1

      - name: Setup OXESpace
        uses: ./.github/actions/setup-oxespace

      - name: Build and upload same-OS bundle
        uses: ./.github/actions/build-oxespace
        with:
          mode: build
          platform-label: ${{ matrix.label }}
          check-windows-notices: "true"
          upload-build: "true"
          upload-sourcemaps: "true"

  unit-shard:
    name: Unit and integration tests (${{ matrix.label }}, ${{ matrix.shard }}/${{ matrix.total }})
    needs: [changes, quick]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.quick.result == 'success' && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: windows-x64, os: windows-2022, shard: 1, total: 5 }
          - { label: windows-x64, os: windows-2022, shard: 2, total: 5 }
          - { label: windows-x64, os: windows-2022, shard: 3, total: 5 }
          - { label: windows-x64, os: windows-2022, shard: 4, total: 5 }
          - { label: windows-x64, os: windows-2022, shard: 5, total: 5 }
          - { label: linux-x64, os: ubuntu-22.04, shard: 1, total: 4 }
          - { label: linux-x64, os: ubuntu-22.04, shard: 2, total: 4 }
          - { label: linux-x64, os: ubuntu-22.04, shard: 3, total: 4 }
          - { label: linux-x64, os: ubuntu-22.04, shard: 4, total: 4 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
          fetch-depth: 0

      - name: Setup OXESpace (Node native only)
        uses: ./.github/actions/setup-oxespace
        with:
          native: node

      - name: Unit and integration tests (shard ${{ matrix.shard }}/${{ matrix.total }})
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:VITEST_COVERAGE_SHARD = '1'
          npx vitest run --coverage --maxWorkers=1 --shard=${{ matrix.shard }}/${{ matrix.total }} --reporter=default --reporter=blob

      - name: Upload the shard's blob report
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-blob-${{ matrix.label }}-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .vitest/blob/

  unit:
    name: Unit and integration tests (${{ matrix.label }})
    needs: [changes, quick, unit-shard]
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' && needs.quick.result == 'success' && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, label: windows-x64 }
          - { os: ubuntu-22.04, label: linux-x64 }
    steps:
      - name: Every shard passed
        shell: bash
        run: |
          if [ "${{ needs.unit-shard.result }}" != "success" ]; then
            echo "::error::a unit shard did not pass (result: ${{ needs.unit-shard.result }}); see the 'Unit and integration tests (<platform>, n/total)' jobs"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
          fetch-depth: 1

      - name: Setup OXESpace
        uses: ./.github/actions/setup-oxespace

      - name: Download the shards' blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-blob-${{ matrix.label }}-*
          path: .vitest/blob
          merge-multiple: true

      - name: Merge the shards and apply the coverage floor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npx vitest --merge-reports .vitest/blob --coverage --reporter=default

      - name: Upload coverage summary
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary-${{ matrix.label }}
          if-no-files-found: warn
          retention-days: 30
          path: coverage/coverage-summary.json

  brand-conformance:
    name: Brand conformance (${{ matrix.label }})
    needs: [changes, quick, build]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.build.result == 'success' && (github.event_name != 'pull_request' || (needs.changes.outputs.code == 'true' && needs.quick.result == 'success')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x64, os: ubuntu-22.04 }
          - { label: windows-x64, os: windows-2022 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
          fetch-depth: 1

      - name: Setup OXESpace (Electron + native)
        uses: ./.github/actions/setup-oxespace
        with:
          linux-deps: "true"
          electron: "true"
          native: electron
          scrub-live-env: "true"

      - name: Restore same-OS build
        uses: ./.github/actions/build-oxespace
        with:
          mode: download
          platform-label: ${{ matrix.label }}

      - name: Brand conformance (OXE-149)
        shell: bash
        env:
          BRAND_OUT: brand-out/brand-conformance-${{ matrix.label }}.json
        run: |
          mkdir -p brand-out
          if [ "$RUNNER_OS" = Linux ]; then
            bash scripts/run-with-xvfb.sh npx playwright test --config playwright.brand.config.ts --reporter=list
          else
            npx playwright test --config playwright.brand.config.ts --reporter=list
          fi

      - name: Upload brand conformance
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brand-conformance-${{ matrix.label }}
          if-no-files-found: ignore
          retention-days: 7
          path: brand-out

  e2e-impacted:
    name: E2E impacted (linux-x64)
    needs: [changes, quick, build]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.code == 'true' && needs.quick.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
          fetch-depth: 1

      - name: Select impacted E2E specs
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          plan=$(printf '%s\n' "$files" | node scripts/related-e2e.mjs --stdin --json)
          echo "$plan"
          smoke=$(jq -r '.smoke | join(" ")' <<<"$plan")
          acceptance=$(jq -r '.acceptance | join(" ")' <<<"$plan")
          has_specs=false
          if [ -n "$smoke" ] || [ -n "$acceptance" ]; then has_specs=true; fi
          {
            echo "smoke=$smoke"
            echo "acceptance=$acceptance"
            echo "has_specs=$has_specs"
          } >> "$GITHUB_OUTPUT"
          if [ "$has_specs" = "false" ]; then
            echo "No impacted E2E specs for this PR; skipping Electron setup."
          fi

      - name: Setup OXESpace (Electron + native)
        if: steps.select.outputs.has_specs == 'true'
        uses: ./.github/actions/setup-oxespace
        with:
          linux-deps: "true"
          electron: "true"
          native: electron
          scrub-live-env: "true"

      - name: Restore Linux build
        if: steps.select.outputs.has_specs == 'true'
        uses: ./.github/actions/build-oxespace
        with:
          mode: download
          platform-label: linux-x64

      - name: Run impacted smoke specs (Linux)
        if: steps.select.outputs.smoke != ''
        shell: bash
        env:
          SMOKE_SPECS: ${{ steps.select.outputs.smoke }}
        run: |
          set -euo pipefail
          read -r -a specs <<< "$SMOKE_SPECS"
          bash scripts/run-with-xvfb.sh npm run test:e2e -- "${specs[@]}" --reporter=list --trace retain-on-failure

      - name: Run impacted acceptance specs (Linux)
        if: steps.select.outputs.acceptance != ''
        shell: bash
        env:
          ACCEPTANCE_SPECS: ${{ steps.select.outputs.acceptance }}
        run: |
          set -euo pipefail
          read -r -a specs <<< "$ACCEPTANCE_SPECS"
          bash scripts/run-with-xvfb.sh npx playwright test -c playwright.acceptance.config.ts "${specs[@]}" --reporter=list --trace retain-on-failure

      - name: Upload impacted E2E traces (failures)
        if: failure() && steps.select.outputs.has_specs == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-impacted-traces-linux
          if-no-files-found: ignore
          retention-days: 7
          path: test-results/**/trace.zip

  e2e:
    name: E2E and native tests (${{ matrix.label }}, ${{ matrix.shard }}/4)
    needs: [changes, quick, build]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.changes.result == 'success' && needs.build.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        label: [windows-x64, linux-x64]
        shard: [1, 2, 3, 4]
        include:
          - { label: windows-x64, os: windows-2022, os_name: windows }
          - { label: linux-x64, os: ubuntu-22.04, os_name: linux }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
          fetch-depth: ${{ matrix.shard == 1 && 0 || 1 }}

      - name: Setup OXESpace (Electron + native)
        uses: ./.github/actions/setup-oxespace
        with:
          linux-deps: "true"
          electron: "true"
          native: electron
          scrub-live-env: "true"

      - name: Restore same-OS build
        uses: ./.github/actions/build-oxespace
        with:
          mode: download
          platform-label: ${{ matrix.label }}

      - name: Upgrade rehearsal (previous stable database, forward and back)
        if: matrix.shard == 1
        shell: pwsh
        env:
          OXESPACE_REQUIRE_UPGRADE_TAG: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run test:electron -- tests/integration/upgrade-rehearsal.native.test.ts

      - name: Process tree cleanup (native)
        if: matrix.shard == 1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run test:electron -- tests/integration/process-tree.native.test.ts

      - name: OxeQuery coverage gate
        if: matrix.shard == 1
        shell: bash
        run: npm run test:coverage:oxequery

      - name: E2E smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OXESPACE_PACKAGED_SMOKE: ${{ needs.quick.outputs.packaged_smoke }}
          E2E_SHARD: ${{ matrix.shard }}/4
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report
          PLAYWRIGHT_BLOB_OUTPUT_NAME: e2e-${{ matrix.label }}-${{ matrix.shard }}.zip
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run test:e2e -- "--shard=$env:E2E_SHARD" --reporter=list,blob --trace retain-on-failure

      - name: E2E smoke (Linux)
        if: runner.os == 'Linux'
        env:
          OXESPACE_PACKAGED_SMOKE: ${{ needs.quick.outputs.packaged_smoke }}
          E2E_SHARD: ${{ matrix.shard }}/4
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report
          PLAYWRIGHT_BLOB_OUTPUT_NAME: e2e-${{ matrix.label }}-${{ matrix.shard }}.zip
        run: bash scripts/run-with-xvfb.sh npm run test:e2e -- "--shard=$E2E_SHARD" --reporter=list,blob --trace retain-on-failure

      - name: Upload E2E traces (failures)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces-${{ matrix.os_name }}-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 7
          path: test-results/**/trace.zip

      - name: Upload E2E blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-blob-${{ matrix.label }}-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 7
          path: blob-report

      - name: E2E performance gate (Linux)
        id: perf_linux
        if: runner.os == 'Linux' && matrix.shard == 4 && needs.quick.outputs.packaged_smoke != 'true'
        continue-on-error: ${{ !inputs.strict_perf_gate }}
        env:
          OXESPACE_PERF_GATE: "1"
        run: |
          set -o pipefail
          bash scripts/run-with-xvfb.sh npm run bench:ui 2>&1 | tee perf-gate.log

      - name: E2E performance gate (Windows)
        id: perf_windows
        if: runner.os == 'Windows' && matrix.shard == 4 && needs.quick.outputs.packaged_smoke != 'true'
        continue-on-error: ${{ !inputs.strict_perf_gate }}
        shell: bash
        env:
          OXESPACE_PERF_GATE: "1"
        run: |
          set -o pipefail
          npm run bench:ui 2>&1 | tee perf-gate.log

      - name: Record the performance gate
        if: ${{ !cancelled() && matrix.shard == 4 && needs.quick.outputs.packaged_smoke != 'true' && !inputs.strict_perf_gate }}
        shell: bash
        env:
          OUTCOME: ${{ (runner.os == 'Windows' && steps.perf_windows.outcome) || (runner.os == 'Linux' && steps.perf_linux.outcome) || 'skipped' }}
        run: |
          mkdir -p perf-gate
          node scripts/perf-gate-outcome.mjs record "${{ matrix.label }}" "${{ matrix.os }}" "$RUNNER_OS" "$OUTCOME" perf-gate.log perf-gate/outcome.json
          grep -aE '\[(RESULT|CONFIRM)\]|exceeded' perf-gate.log > perf-gate/results.txt 2>/dev/null || true

      - name: Upload the performance gate record
        if: ${{ !cancelled() && matrix.shard == 4 && needs.quick.outputs.packaged_smoke != 'true' && !inputs.strict_perf_gate }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-gate-${{ matrix.label }}
          retention-days: 7
          path: perf-gate

      - name: Performance benchmark (informational)
        if: matrix.shard == 4 && !inputs.strict_perf_gate && needs.quick.outputs.packaged_smoke != 'true'
        continue-on-error: true
        run: npx vitest bench --run tests/bench/hotpaths.bench.ts

  perf-plan:
    name: Performance gate recheck plan
    needs: [quick, e2e]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.e2e.result == 'success' && !inputs.strict_perf_gate && needs.quick.outputs.packaged_smoke != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      recheck: ${{ steps.plan.outputs.recheck }}
      known: ${{ steps.plan.outputs.known }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: perf-gate-*
          path: perf-gate
      - name: Plan
        id: plan
        run: |
          node - <<'EOF'
          const { readdirSync, readFileSync, appendFileSync, existsSync } = require('node:fs')
          const records = existsSync('perf-gate') ? readdirSync('perf-gate').map(dir => JSON.parse(readFileSync(`perf-gate/${dir}/outcome.json`, 'utf8'))) : []
          for (const record of records) console.log(`${record.label}: ${record.outcome}`)
          for (const label of ['linux-x64', 'windows-x64']) if (!records.some(record => record.label === label)) {
            console.log(`::error::no performance gate record for ${label}`)
            process.exit(1)
          }
          const recheck = records.filter(record => record.outcome === 'failure').map(({ label, os }) => ({ label, os }))
          const known = records.filter(record => record.outcome === 'known').flatMap(record => (record.known ?? []).map(k => ({ label: record.label, ...k })))
          for (const k of known) {
            console.log(`::warning title=Known performance failure (${k.card})::${k.label}: ${k.test} — ${k.error}`)
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- known performance failure on ${k.label} (${k.card}, accepted while it is open): ${k.test} — ${k.error}\n`)
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `known=${JSON.stringify(known)}\n`)
          appendFileSync(process.env.GITHUB_OUTPUT, `recheck=${JSON.stringify(recheck)}\n`)
          console.log(recheck.length ? `recheck on a fresh runner: ${recheck.map(r => r.label).join(', ')}` : known.length ? `no gate to recheck; ${known.length} known failure(s), each with its card` : 'every performance gate passed')
          EOF

  perf-recheck:
    name: Performance gate recheck (${{ matrix.label }})
    needs: [changes, quick, build, perf-plan]
    if: ${{ !cancelled() && needs.perf-plan.result == 'success' && needs.perf-plan.outputs.recheck != '[]' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.perf-plan.outputs.recheck) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
          fetch-depth: 1

      - name: Setup OXESpace (Electron + native)
        uses: ./.github/actions/setup-oxespace
        with:
          linux-deps: "true"
          electron: "true"
          native: electron

      - name: Restore same-OS build
        uses: ./.github/actions/build-oxespace
        with:
          mode: download
          platform-label: ${{ matrix.label }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: perf-gate-${{ matrix.label }}
          path: first-run

      - name: The first run's numbers
        shell: bash
        run: |
          echo "### Performance gate, first run (${{ matrix.label }}, failed)" | tee -a "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' first-run/results.txt | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Performance gate, second run (fresh runner)
        shell: bash
        env:
          OXESPACE_PERF_GATE: "1"
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = Linux ]; then run=(bash scripts/run-with-xvfb.sh npm run bench:ui); else run=(npm run bench:ui); fi
          status=0
          "${run[@]}" 2>&1 | tee perf-gate.log || status=$?
          {
            echo "### Performance gate, second run (${{ matrix.label }}, fresh runner): $([ "$status" = 0 ] && echo passed || echo FAILED)"
            grep -aE '\[(RESULT|CONFIRM)\]|exceeded' perf-gate.log | sed 's/^/    /' || true
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != 0 ] && node scripts/perf-gate-outcome.mjs recheck "$RUNNER_OS" "$status" perf-gate.log; then
            echo "::notice title=Performance gate::the second run failed only on the known failures ci.yml names with their cards (${{ matrix.label }})"
            exit 0
          fi
          if [ "$status" != 0 ]; then echo "::error title=Performance gate::failed on two runners (${{ matrix.label }}): a real regression until the per-OS trend says otherwise (flakes.md FL-21)"; exit 1; fi
          echo "::notice title=Performance gate::the first run failed on one runner and the second passed on a fresh one (${{ matrix.label }}): runner noise, see FL-04"

  a11y:
    name: axe scan (${{ matrix.label }})
    needs: [changes, quick, build]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.build.result == 'success' && (github.event_name != 'pull_request' || (needs.changes.outputs.a11y == 'true' && needs.quick.result == 'success')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, label: ubuntu, platform_label: linux-x64 }
          - { os: windows-2022, label: windows, platform_label: windows-x64 }
    env:
      OXE_A11Y_REPORT: ${{ github.workspace }}/a11y-report.jsonl
      OXE_A11Y_STRICT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
          fetch-depth: 1

      - name: Setup OXESpace (Electron + native)
        uses: ./.github/actions/setup-oxespace
        with:
          linux-deps: "true"
          electron: "true"
          native: electron

      - name: Restore same-OS build
        uses: ./.github/actions/build-oxespace
        with:
          mode: download
          platform-label: ${{ matrix.platform_label }}

      - name: Scan
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then bash scripts/run-with-xvfb.sh npm run test:a11y; else npm run test:a11y; fi

      - name: Critical and serious findings
        if: always()
        shell: bash
        run: |
          test -f "$OXE_A11Y_REPORT" || { echo "no report written: the scan found no violations at all"; exit 0; }
          echo "entries: $(wc -l < "$OXE_A11Y_REPORT")"
          echo "scan-not-reached: $(grep -c '"rule":"scan-not-reached"' "$OXE_A11Y_REPORT" || true)"
          bad=$(grep -E '"impact":"(critical|serious)"' "$OXE_A11Y_REPORT" || true)
          if [ -n "$bad" ]; then echo "$bad" | cut -c1-400; echo "::error::critical or serious accessibility findings"; exit 1; fi
          echo "no critical or serious findings"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-report-${{ matrix.label }}
          if-no-files-found: ignore
          retention-days: 14
          path: a11y-report.jsonl

  oxequery-live:
    name: OxeQuery live tests (${{ matrix.engine }}; PostgreSQL, MongoDB, SSH, TLS)
    needs: [changes, quick, build]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.build.result == 'success' && (github.event_name != 'pull_request' || (needs.changes.outputs.oxequery == 'true' && needs.quick.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
          fetch-depth: 1

      - name: Setup OXESpace (Node native + Electron cache)
        uses: ./.github/actions/setup-oxespace
        with:
          electron-cache-only: "true"
          native: node

      - name: Restore Linux build
        uses: ./.github/actions/build-oxespace
        with:
          mode: download
          platform-label: linux-x64

      - name: Pull the images the tests use
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          pull() { for try in 1 2 3 4; do "$ENGINE" pull "$1" && return 0; [ "$try" -lt 4 ] && { echo "::warning::$ENGINE pull $1 failed (try $try/4), retrying in $((15 * try)) s"; sleep $((15 * try)); }; done; echo "::error::$ENGINE pull $1 failed 4 times"; return 1; }
          "$ENGINE" --version
          pull docker.io/library/postgres:16-alpine
          pull docker.io/library/mongo:7
          pull docker.io/library/alpine:3.20

      - name: Live tests
        env:
          OXE_LIVE: "1"
          OXE_CONTAINER_ENGINE: ${{ matrix.engine }}
        run: npx vitest run tests/live/oxequery-live.test.ts tests/live/oxequery-connectivity-live.test.ts tests/live/oxequery-writes-live.test.ts

  oxequery-live-versions:
    name: OxeQuery live tests (PostgreSQL ${{ matrix.pg }}, MongoDB ${{ matrix.mongo }})
    needs: [changes, quick, build]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.build.result == 'success' && (github.event_name != 'pull_request' || (needs.changes.outputs.oxequery == 'true' && needs.quick.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pg: "12-alpine", mongo: "5.0" }
          - { pg: "14-alpine", mongo: "6.0" }
          - { pg: "17-alpine", mongo: "8.0" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
          fetch-depth: 1

      - name: Setup OXESpace (Node native + Electron cache)
        uses: ./.github/actions/setup-oxespace
        with:
          electron-cache-only: "true"
          native: node

      - name: Restore Linux build
        uses: ./.github/actions/build-oxespace
        with:
          mode: download
          platform-label: linux-x64

      - name: Choose the MongoDB image for this runner's kernel
        id: mongo
        run: |
          mongo="${{ matrix.mongo }}"
          kernel="$(uname -r | cut -d- -f1)"
          if [ "${mongo%%.*}" -ge 8 ] && [ "$(printf '6.19\n%s\n' "$kernel" | sort -V | head -1)" = "6.19" ]; then
            echo "::notice title=MongoDB ${mongo} skipped::Linux ${kernel} cannot run MongoDB 8.x (SERVER-121912); this leg uses MongoDB 7.0."
            mongo="7.0"
          fi
          echo "image=docker.io/library/mongo:${mongo}" >> "$GITHUB_OUTPUT"

      - name: Pull the images the tests use
        run: |
          ENGINE=docker
          pull() { for try in 1 2 3 4; do "$ENGINE" pull "$1" && return 0; [ "$try" -lt 4 ] && { echo "::warning::$ENGINE pull $1 failed (try $try/4), retrying in $((15 * try)) s"; sleep $((15 * try)); }; done; echo "::error::$ENGINE pull $1 failed 4 times"; return 1; }
          pull docker.io/library/postgres:${{ matrix.pg }}
          pull ${{ steps.mongo.outputs.image }}
          pull docker.io/library/postgres:16-alpine
          pull docker.io/library/alpine:3.20

      - name: Live tests
        env:
          OXE_LIVE: "1"
          OXE_CONTAINER_ENGINE: docker
          OXE_LIVE_PG_IMAGE: docker.io/library/postgres:${{ matrix.pg }}
          OXE_LIVE_MONGO_IMAGE: ${{ steps.mongo.outputs.image }}
        run: npx vitest run tests/live/oxequery-live.test.ts tests/live/oxequery-connectivity-live.test.ts tests/live/oxequery-writes-live.test.ts

  # Packaged smoke (no release publishing): triggered by workflow_dispatch or nightly.yml via workflow_call.
  package:
    name: Package smoke (${{ matrix.label }})
    needs: [changes, quick, build, unit, brand-conformance, e2e]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' && needs.quick.result == 'success'
      && needs.build.result == 'success' && needs.unit.result == 'success'
      && needs.brand-conformance.result == 'success' && needs.e2e.result == 'success'
      && needs.quick.outputs.packaged_smoke == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, label: windows-x64, builder_flag: "--win" }
          - { os: ubuntu-22.04, label: linux-x64, builder_flag: "--linux" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.quick.outputs.sha }}
          fetch-depth: 1

      - name: Setup OXESpace (Electron + native)
        uses: ./.github/actions/setup-oxespace
        with:
          linux-deps: "true"
          electron: "true"
          native: electron

      - name: Restore same-OS build
        uses: ./.github/actions/build-oxespace
        with:
          mode: download
          platform-label: ${{ matrix.label }}

      - name: Package installer and verify fuses (${{ matrix.label }})
        id: pkg
        uses: ./.github/actions/package-electron
        with:
          platform-flag: ${{ matrix.builder_flag }}
          channel: ${{ needs.quick.outputs.channel }}
          prepare-inspect-copy: "true"
          verify-deb-sandbox: "true"

      - name: E2E packaged Linux build
        if: runner.os == 'Linux'
        shell: bash
        env:
          OXESPACE_PACKAGED_EXECUTABLE: ${{ steps.pkg.outputs.executable-path }}
        run: bash scripts/run-with-xvfb.sh npx playwright test --config playwright.tools.config.ts packaged-linux.spec.ts

      - name: E2E packaged Windows build
        if: runner.os == 'Windows'
        shell: bash
        env:
          OXESPACE_PACKAGED_EXECUTABLE: ${{ steps.pkg.outputs.executable-path }}
        run: npx playwright test --config playwright.tools.config.ts packaged-win.spec.ts

  ci-result:
    name: CI result
    needs: [changes, dependency-review, check-origin, quick, build, unit, brand-conformance, e2e-impacted, e2e, a11y, perf-plan, perf-recheck, package, oxequery-live, oxequery-live-versions]
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.e2e.result != 'skipped'
        continue-on-error: true
        with:
          ref: ${{ needs.changes.outputs.sha }}
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the E2E blob reports
        if: needs.e2e.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-blob-*
          path: blobs

      - name: Merge the E2E reports per platform
        if: needs.e2e.result != 'skipped'
        continue-on-error: true
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          set -euo pipefail
          version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
          for label in windows-x64 linux-x64; do
            mkdir -p "merged/$label"
            find blobs -path "blobs/e2e-blob-$label-*" -name '*.zip' -exec cp {} "merged/$label/" \;
            if [ -z "$(ls -A "merged/$label")" ]; then echo "no blob reports for $label"; continue; fi
            PLAYWRIGHT_HTML_OUTPUT_DIR="e2e-report/$label" npx --yes "playwright@$version" merge-reports --reporter html "merged/$label"
          done

      - name: Upload the merged E2E report
        if: needs.e2e.result != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          if-no-files-found: ignore
          retention-days: 7
          path: e2e-report

      - name: Decide the run's result
        id: decide
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          STRICT_PERF: ${{ inputs.strict_perf_gate }}
        run: |
          node - <<'EOF'
          const needs = JSON.parse(process.env.NEEDS)
          const pr = process.env.EVENT_NAME === 'pull_request'
          const code = needs.changes.outputs?.code === 'true'
          const oxequery = needs.changes.outputs?.oxequery === 'true'
          const deps = needs.changes.outputs?.deps === 'true'
          const a11y = needs.changes.outputs?.a11y === 'true'
          const strictPerf = process.env.STRICT_PERF === 'true'
          const problems = []
          for (const [job, { result }] of Object.entries(needs)) {
            console.log(`${job}: ${result}`)
            if (result === 'failure' || result === 'cancelled') problems.push(`${job} ${result}`)
          }
          const nondoc = Number(needs.changes.outputs?.nondoc ?? '0')
          if (pr && !code && nondoc > 0) problems.push(`changes said docs-only (code=false) but counted ${nondoc} file(s) outside docs/, .claude/ and *.md`)
          const required = ['changes', ...(deps ? ['dependency-review'] : []), ...(pr ? ['check-origin'] : [])]
          if (!pr) required.push('quick', 'build', 'unit', 'brand-conformance', 'e2e', 'a11y', 'oxequery-live', 'oxequery-live-versions')
          else if (code) required.push('quick', 'build', 'unit', 'brand-conformance', 'e2e-impacted', ...(oxequery ? ['oxequery-live', 'oxequery-live-versions'] : []))
          if (pr && a11y) required.push('a11y')
          if (needs.quick.outputs?.packaged_smoke === 'true') required.push('package')
          for (const job of required) if (needs[job].result !== 'success') problems.push(`${job} should have passed and is ${needs[job].result}`)
          const packagedSmoke = needs.quick.outputs?.packaged_smoke === 'true'
          if (needs.e2e.result === 'success' && !packagedSmoke && !strictPerf && !pr) {
            if (needs['perf-plan'].result !== 'success') problems.push(`perf-plan should have passed and is ${needs['perf-plan'].result}`)
            else if ((needs['perf-plan'].outputs?.recheck ?? '[]') !== '[]' && needs['perf-recheck'].result !== 'success') problems.push(`perf-recheck should have passed and is ${needs['perf-recheck'].result}`)
            for (const k of JSON.parse(needs['perf-plan'].outputs?.known || '[]')) console.log(`::warning title=Known performance failure (${k.card})::accepted while ${k.card} is open: ${k.label} ${k.test} — ${k.error}`)
          }
          if (problems.length) {
            console.log(`::error title=CI failed::${[...new Set(problems)].join('; ')}`)
            process.exit(1)
          }
          console.log('every job that had to run passed')
          EOF

      - name: Post the result as a commit status for the tested commit
        if: ${{ always() && github.workflow == 'CI' && github.event_name == 'workflow_dispatch' && needs.changes.outputs.sha != '' && github.ref_name != github.event.repository.default_branch }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.changes.outputs.sha }}
          OUTCOME: ${{ steps.decide.outcome }}
          RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = "success" ]; then state=success; text="every job that had to run passed"; else state=failure; text="CI failed ($OUTCOME)"; fi
          gh api "repos/$REPO/statuses/$SHA" -f state="$state" -f context="CI result" -f description="$text" -f target_url="$RUN_URL" >/dev/null
          echo "status CI result=$state on $SHA"

      - name: Download the brand conformance results
        if: ${{ !cancelled() && github.workflow == 'CI' && needs.brand-conformance.result != 'skipped' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: brand-conformance-*
          path: brand
          merge-multiple: true

      - name: Post the brand conformance status (OXE-149)
        if: ${{ !cancelled() && github.workflow == 'CI' && needs.brand-conformance.result != 'skipped' && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch)) }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || needs.changes.outputs.sha }}
          RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: |
          set -euo pipefail
          node - <<'EOF'
          const fs = require('fs'), path = require('path')
          const dir = 'brand'
          const files = fs.existsSync(dir) ? fs.readdirSync(dir).filter(name => name.endsWith('.json')) : []
          let enforced = 0, pending = 0, checks = 0
          const lines = []
          for (const name of files) {
            const { results } = JSON.parse(fs.readFileSync(path.join(dir, name), 'utf8'))
            for (const result of results) {
              checks++
              if (result.ok) continue
              if (result.state === 'enforced') { enforced++; lines.push(`- ${name}: ${result.id} ${result.density}/${result.theme}: ${result.measured}${result.detail ? ` (${result.detail})` : ''}`) } else pending++
            }
          }
          const state = files.length < 2 || enforced ? 'failure' : 'success'
          const text = files.length < 2 ? `results from ${files.length} of 2 platforms` : `${enforced} enforced divergence(s), ${pending} pending reported, ${checks} checks`
          const nl = String.fromCharCode(10)
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'brand-status'), [state, text, ''].join(nl))
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, ['### Brand conformance (OXE-149)', '', text, '', ...lines.slice(0, 40), ''].join(nl))
          EOF
          { read -r BRAND_STATE; read -r BRAND_TEXT; } < "$RUNNER_TEMP/brand-status"
          gh api "repos/$REPO/statuses/$SHA" -f state="$BRAND_STATE" -f context="marca/conformidade" -f description="$BRAND_TEXT" -f target_url="$RUN_URL" >/dev/null
          echo "status marca/conformidade=$BRAND_STATE on $SHA: $BRAND_TEXT"

  wake-merge-train:
    name: Wake the merge train
    needs: [ci-result]
    if: >-
      ${{ always() && github.workflow == 'CI' && github.event_name == 'workflow_dispatch'
      && github.triggering_actor == 'github-actions[bot]'
      && !inputs.packaged_smoke_only && (inputs.branch == '' || inputs.branch == github.ref_name) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the merge train
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh workflow run merge-train.yml --ref "${{ github.event.repository.default_branch }}" -f wait_for_run="$RUN_ID" \
            || echo "::warning title=Merge train not woken::the dispatch failed; the train's cron will pick this run up"
