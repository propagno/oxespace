name: Nightly
run-name: >-
  Nightly · ${{ inputs.suite || (github.event_name == 'pull_request' && format('PR #{0} provider-contract', github.event.pull_request.number) || 'all') }}

# Consolidated nightly health & regression suite (OXE-434):
#   1) provider-probe + provider-report — verifies Claude Code & Codex CLI protocol contracts (also runs on PRs
#      modifying the probe scripts), publishes compatibility.json to the provider-contract branch, and manages issues.
#   2) packaged-smoke (native workflow_call → ci.yml with packaged_smoke_only=true; zero idle watcher runner) +
#      packaged-smoke-notify (opens/closes "Nightly packaged smoke failing on main").
#   3) acceptance (full e2e/acceptance suite on main) + acceptance-notify (opens/closes "Nightly acceptance e2e failing on main").
#   4) perf-load (e2e/perf-load.spec.ts on Windows + Linux with cached Electron runtime).

on:
  schedule:
    # 05:00 UTC = 02:00 BRT: quiet window for the merge train.
    - cron: "0 5 * * *"
  pull_request:
    branches: [main]
    paths:
      - scripts/probe-providers.cjs
      - scripts/probe-claude-protocol.cjs
      - scripts/provider-contract-report.mjs
      - .github/workflows/nightly.yml
  workflow_dispatch:
    inputs:
      suite:
        description: Which nightly suite(s) to run
        required: false
        default: all
        type: choice
        options: [all, packaged-smoke, acceptance, provider-contract, perf-load]
      os:
        description: Runner OS for the acceptance suite
        required: false
        default: ubuntu-24.04
        type: choice
        options: [ubuntu-24.04, windows-2022]
      claude_version:
        description: Claude Code version to probe (npm dist-tag or version)
        required: false
        default: latest
        type: string
      codex_version:
        description: Codex version to probe (npm dist-tag or version)
        required: false
        default: latest
        type: string

concurrency:
  group: nightly-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || inputs.suite || 'all' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  provider-probe:
    name: Provider probe (${{ matrix.os }})
    if: >-
      ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft)
      && (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'provider-contract') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install the provider CLIs
        shell: bash
        env:
          CLAUDE_VERSION: ${{ inputs.claude_version || 'latest' }}
          CODEX_VERSION: ${{ inputs.codex_version || 'latest' }}
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_VERSION}" "@openai/codex@${CODEX_VERSION}"

      - name: Probe the providers
        continue-on-error: true
        run: node scripts/probe-providers.cjs --json "report-${{ matrix.os }}.json"

      - name: Probe the Claude control protocol
        continue-on-error: true
        run: node scripts/probe-claude-protocol.cjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: provider-report-${{ matrix.os }}
          path: report-${{ matrix.os }}.json
          if-no-files-found: warn

  provider-report:
    name: Provider contract report
    needs: [provider-probe]
    if: ${{ always() && !cancelled() && needs.provider-probe.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: reports
          pattern: provider-report-*

      - name: Summarize
        id: summary
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROBE_OS: ubuntu-latest,windows-latest
        run: |
          if node scripts/provider-contract-report.mjs reports compatibility.json issue.md; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility
          path: compatibility.json

      - name: Publish compatibility.json
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir publish && cp compatibility.json publish/ && cd publish
          git init -q -b provider-contract
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compatibility.json
          git commit -q -m "Provider contract check $(date -u +%Y-%m-%d)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" provider-contract

      - name: Fail the pull request check
        if: steps.summary.outputs.ok == 'false' && github.event_name == 'pull_request'
        run: cat issue.md && exit 1

      - name: Open or update the issue
        if: steps.summary.outputs.ok == 'false' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create provider-contract --color B60205 --description "Nightly provider CLI contract check" 2>/dev/null || true
          number=$(gh issue list --label provider-contract --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then gh issue comment "$number" --body-file issue.md; else gh issue create --title "Provider contract check failing" --label provider-contract --body-file issue.md; fi
          exit 1

      - name: Close the issue when the contract holds again
        if: steps.summary.outputs.ok == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for number in $(gh issue list --label provider-contract --state open --json number --jq '.[].number'); do gh issue close "$number" --comment "The contract check passes again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; done

  resolve-head:
    name: Resolve main HEAD
    if: >-
      ${{ github.event_name != 'pull_request'
      && (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'packaged-smoke') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: Resolve main commit SHA
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "main HEAD: $sha"

  packaged-smoke:
    name: Packaged smoke (CI)
    needs: [resolve-head]
    if: ${{ github.event_name != 'pull_request' && needs.resolve-head.result == 'success' }}
    permissions:
      contents: read
      pull-requests: read
      statuses: write
      actions: write
    uses: ./.github/workflows/ci.yml
    with:
      branch: ${{ needs.resolve-head.outputs.sha }}
      packaged_smoke_only: true

  packaged-smoke-notify:
    name: Packaged smoke issue sync
    needs: [resolve-head, packaged-smoke]
    if: ${{ always() && !cancelled() && needs.packaged-smoke.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Sync packaged-smoke issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.packaged-smoke.result }}
          SHA: ${{ needs.resolve-head.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Nightly packaged smoke failing on main"
          if [ "$RESULT" = "success" ]; then
            for number in $(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number'); do
              gh issue close "$number" --comment "The packaged smoke passes on main again: $RUN_URL"
            done
          else
            body="The packaged smoke failed on main at \`${SHA:-unknown}\`: $RUN_URL. Installers from this commit must not be released until it passes again (docs/ci-cd.md, Before publishing a release)."
            existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
            exit 1
          fi

  acceptance:
    name: Acceptance e2e (${{ inputs.os || 'ubuntu-24.04' }})
    needs: [provider-report]
    if: >-
      ${{ always() && !cancelled() && github.event_name != 'pull_request'
      && (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'acceptance') }}
    runs-on: ${{ inputs.os || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup OXESpace (Electron + native)
        uses: ./.github/actions/setup-oxespace
        with:
          linux-deps: "true"
          electron: "true"
          native: electron
          verify-native: "false"
          scrub-live-env: "true"

      - name: Build app
        uses: ./.github/actions/build-oxespace
        with:
          mode: build
          platform-label: ${{ runner.os == 'Windows' && 'windows-x64' || 'linux-x64' }}
          rebuild-native-node: "false"
          check-bundle-imports: "false"

      - name: Run acceptance suite (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: npx playwright test -c playwright.acceptance.config.ts --trace retain-on-failure

      - name: Run acceptance suite (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/run-with-xvfb.sh npx playwright test -c playwright.acceptance.config.ts --trace retain-on-failure

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-nightly-${{ github.run_id }}-${{ inputs.os || 'ubuntu-24.04' }}
          if-no-files-found: ignore
          retention-days: 7
          path: test-results/

  acceptance-notify:
    name: Acceptance e2e issue sync
    needs: [acceptance]
    if: ${{ always() && !cancelled() && needs.acceptance.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Sync acceptance issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.acceptance.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Nightly acceptance e2e failing on main"
          if [ "$RESULT" = "success" ]; then
            for number in $(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number'); do
              gh issue close "$number" --comment "Nightly acceptance e2e passes on main again: $RUN_URL"
            done
          else
            body="Nightly acceptance e2e failed on main at \`${GITHUB_SHA::12}\`: $RUN_URL."
            existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
            exit 1
          fi

  perf-load:
    name: Performance under load (${{ matrix.label }})
    needs: [provider-report]
    if: >-
      ${{ always() && !cancelled() && github.event_name != 'pull_request'
      && (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'perf-load') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: windows-x64, os: windows-2022 }
          - { label: linux-x64, os: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup OXESpace (Electron + native)
        uses: ./.github/actions/setup-oxespace
        with:
          linux-deps: "true"
          electron: "true"
          native: both

      - name: Build app
        uses: ./.github/actions/build-oxespace
        with:
          mode: build
          platform-label: ${{ matrix.label }}
          rebuild-native-node: "false"
          check-bundle-imports: "false"

      - name: Load test
        shell: bash
        env:
          OXESPACE_LOAD_RESULTS: ${{ github.workspace }}/results/perf-load/results.txt
        run: |
          set -o pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            bash scripts/run-with-xvfb.sh npx playwright test --config playwright.tools.config.ts e2e/perf-load.spec.ts --reporter=line 2>&1 | tee results-log.txt
          else
            npx playwright test --config playwright.tools.config.ts e2e/perf-load.spec.ts --reporter=line 2>&1 | tee results-log.txt
          fi

      - name: Summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo "### Performance under load (${{ matrix.label }})"
            echo
            echo '```'
            if [[ -f results/perf-load/results.txt ]]; then cat results/perf-load/results.txt; else grep -a '\[LOAD\]' results-log.txt || echo "no [LOAD] lines"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p results/perf-load
          cp results-log.txt results/perf-load/ 2>/dev/null || true

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-load-${{ matrix.label }}
          if-no-files-found: warn
          retention-days: 30
          path: results/perf-load/
