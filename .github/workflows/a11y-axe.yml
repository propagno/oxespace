name: Accessibility scan (axe)

# Runs the extended axe scan (WCAG 2.2 AA, on Linux and Windows) of the app surfaces (both themes, Settings in both scopes) and
# prints every critical or serious finding. Never publishes anything.
# - On every pull request to main it is a gate: OXE_A11Y_STRICT=1 fails the run on any critical
#   or serious finding (moderate and minor ones stay in the uploaded report).
# - On a release branch, touching this file re-runs the scan on the candidate.
# See docs/validation/a11y-axe-2026-10-14.md for what the scan covers and its limits, and
# docs/validation/screen-reader-1.4.md for the manual screen-reader pass axe cannot replace.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    # Only what can change what the scan sees: not docs, not tests, not the Android app or the
    # phone protocol, not the other workflows.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"
      - "electron/main/**/*.test.ts"
      - "tests/**"
      - "mobile/**"
      - "scripts/android/**"
      - "shared/remote/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/android.yml"
      - ".github/workflows/memory-compatibility.yml"
      - ".github/workflows/provider-contract.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/visual-baselines.yml"
      - ".github/workflows/visual-regression.yml"
  # A manual run needs the file on the default branch; a change to this file on a release
  # branch runs it there, which is how a candidate gets scanned before the file is merged.
  push:
    branches: ["release/**"]
    paths: [".github/workflows/a11y-axe.yml"]

concurrency:
  # A newer push to the same pull request replaces the scan of the older one.
  # A push to a draft scans nothing, so it gets a group of its own and cannot cancel the ready-for-review scan.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.pull_request.draft && '-draft' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  axe:
    # A draft PR runs nothing; marking it ready for review starts the run.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    # WCAG 2.2 AA on both desktop platforms: fonts, scrollbars and native controls differ, and so can what axe sees.
    name: axe scan (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: ubuntu
          - os: windows-2022
            label: windows
    env:
      OXE_A11Y_REPORT: ${{ github.workspace }}/a11y-report.jsonl
      OXE_A11Y_STRICT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Ubuntu 24.04 renamed libasound2 (64-bit time_t); 22.04 has only the old name.
          alsa=libasound2t64; apt-cache show "$alsa" >/dev/null 2>&1 || alsa=libasound2
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 "$alsa" \
            libxshmfence1 libnotify4

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Prepare and verify native modules for Electron
        run: |
          npm run fix:native
          npm run verify:native

      - name: Scan
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then bash scripts/run-with-xvfb.sh npm run test:a11y; else npm run test:a11y; fi

      - name: Critical and serious findings
        if: always()
        shell: bash
        run: |
          # The spec only writes the report when it finds something (the first run proved the path works).
          test -f "$OXE_A11Y_REPORT" || { echo "no report written: the scan found no violations at all"; exit 0; }
          echo "entries: $(wc -l < "$OXE_A11Y_REPORT")"
          echo "scan-not-reached: $(grep -c '"rule":"scan-not-reached"' "$OXE_A11Y_REPORT" || true)"
          bad=$(grep -E '"impact":"(critical|serious)"' "$OXE_A11Y_REPORT" || true)
          if [ -n "$bad" ]; then echo "$bad" | cut -c1-400; echo "::error::critical or serious accessibility findings"; exit 1; fi
          echo "no critical or serious findings"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-report-${{ matrix.label }}
          if-no-files-found: ignore
          retention-days: 14
          path: a11y-report.jsonl
