# OXE-400: the PTY host in the app. e2e/perf/pty-rust-isolation.spec.ts (CA-1: a crash of the PTY host leaves the app
# running) and e2e/perf/pty-rust-quit.spec.ts (CA-4: quitting with live shells never aborts, 30 rounds of each way)
# on the built app with real PTYs, node-pty in the main process (arm A, the OXE-392 baseline) against node-pty in the
# PTY host utility process (arm B, OXESPACE_PTY_HOST=utility). One job per OS; CI only. Runs on pushes to
# ci/pty-host-* (and by hand); never in the smoke run (playwright.config.ts ignores e2e/perf/).
name: PTY host (OXE-400)
run-name: PTY host (OXE-400) · ${{ github.ref_name }}

on:
  push:
    branches: ["ci/pty-host-*"]
  workflow_dispatch:

concurrency:
  group: pty-host-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pty-host:
    name: PTY host (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-2022
          - label: linux-x64
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          alsa=libasound2
          if dpkg -s libasound2t64 >/dev/null 2>&1; then alsa=libasound2t64; fi
          req=(xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 "$alsa" libxshmfence1)
          apt_opts=(-o APT::Sandbox::User=root -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 -o Acquire::Retries=1)
          if ! dpkg -s "${req[@]}" >/dev/null 2>&1; then
            if getent ahostsv4 archive.ubuntu.com >/dev/null 2>&1 && timeout 180 sudo apt-get "${apt_opts[@]}" update && timeout 300 sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends "${req[@]}"; then
              :
            else
              exit 1
            fi
          fi

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Install the pinned Electron runtime
        run: npm rebuild electron

      - name: Build renderer and main process
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run rebuild:native:node
          npm run build

      - name: Prepare and verify native modules for Electron
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run fix:native
          npm run verify:native

      - name: CA-1 and CA-4 in the app
        shell: bash
        env:
          OXESPACE_PTY_QUIT_ROUNDS: "30"
        run: |
          set -o pipefail
          mkdir -p results/pty-host
          if [[ "$RUNNER_OS" == Linux ]]; then
            bash scripts/run-with-xvfb.sh npx playwright test --config playwright.tools.config.ts e2e/perf/pty-rust-isolation.spec.ts e2e/perf/pty-rust-quit.spec.ts --reporter=line 2>&1 | tee results/pty-host/results-log.txt
          else
            npx playwright test --config playwright.tools.config.ts e2e/perf/pty-rust-isolation.spec.ts e2e/perf/pty-rust-quit.spec.ts --reporter=line 2>&1 | tee results/pty-host/results-log.txt
          fi

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### PTY host (${{ matrix.label }})"
            echo
            echo '```'
            grep -a '[PTY-QUIT]|passed|failed|✘|✓' results/pty-host/results-log.txt || echo "no results"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pty-host-${{ matrix.label }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            results/pty-host/
            test-results/
