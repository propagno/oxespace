<svg xmlns="http://www.w3.org/2000/svg" width="760" height="730" viewBox="0 0 760 730" role="img" aria-labelledby="title description">
  <title id="title">Wireframe do modal Nova worktree e thread</title>
  <desc id="description">Modal com escolha da base Git, branch, diretório, agente e destino de execução, seguido de prévia verificável e botão Criar worktree e thread.</desc>
  <defs><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e9ebf2}.muted{fill:#9ca5b9}.dim{fill:#788299}.small{font-size:12px}.tiny{font-size:10px}.body{font-size:14px}.head{font-size:20px;font-weight:650}.strong{font-weight:650}.accent{fill:#5fe2c0}.mono{font-family:Cascadia Mono,Consolas,monospace}</style></defs>
  <rect width="760" height="730" fill="#15171d"/>
  <rect x="29" y="24" width="702" height="682" rx="13" fill="#252833" stroke="#505666"/>
  <text x="56" y="65" class="head">Nova worktree + thread</text><text x="692" y="65" class="body muted">×</text>
  <text x="56" y="90" class="small muted">Crie uma branch isolada e abra uma conversa vinculada ao novo diretório.</text>
  <line x1="56" y1="111" x2="704" y2="111" stroke="#444a58"/>
  <circle cx="71" cy="140" r="13" fill="#248e75"/><text x="67" y="145" class="small strong">1</text><text x="93" y="145" class="small strong">Branch e diretório</text>
  <text x="56" y="184" class="small strong">Projeto</text>
  <rect x="56" y="195" width="648" height="40" rx="7" fill="#303541" stroke="#4a5160"/>
  <text x="71" y="220" class="body">oxespace</text><text x="640" y="220" class="small muted">⌄</text>
  <text x="56" y="264" class="small strong">Origem da branch</text><text x="390" y="264" class="small strong">Nova branch</text>
  <rect x="56" y="275" width="312" height="40" rx="7" fill="#303541" stroke="#4a5160"/>
  <text x="71" y="300" class="body mono">origin/main</text><text x="336" y="300" class="small muted">⌄</text>
  <rect x="390" y="275" width="314" height="40" rx="7" fill="#303541" stroke="#4a5160"/>
  <text x="405" y="300" class="body mono">feat/pagamentos</text>
  <text x="56" y="344" class="small strong">Diretório da worktree</text>
  <rect x="56" y="355" width="648" height="40" rx="7" fill="#303541" stroke="#4a5160"/>
  <text x="71" y="380" class="body mono">C:\Estudos\oxespace-wt\pagamentos</text><text x="670" y="380" class="small muted">…</text>
  <circle cx="71" cy="420" r="13" fill="#248e75"/><text x="67" y="425" class="small strong">2</text><text x="93" y="425" class="small strong">Conversa e agente</text>
  <rect x="56" y="442" width="314" height="40" rx="7" fill="#2d433d" stroke="#38b594"/>
  <text x="72" y="467" class="body accent">◉  Codex</text>
  <rect x="384" y="442" width="320" height="40" rx="7" fill="#303541" stroke="#4a5160"/>
  <text x="400" y="467" class="body muted">○  Claude Code</text>
  <text x="56" y="509" class="small strong">Depois de criar</text>
  <rect x="56" y="521" width="648" height="42" rx="7" fill="#303541" stroke="#4a5160"/>
  <text x="72" y="547" class="body">◉  Abrir thread para eu trabalhar</text>
  <text x="56" y="585" class="small muted">○  Delegar tarefa a outro agente nesta worktree</text>
  <rect x="56" y="612" width="648" height="40" rx="7" fill="#283a36" stroke="#397663"/>
  <text x="72" y="637" class="small accent">Prévia: nova worktree · feat/pagamentos · base origin/main · sem alterar o Code</text>
  <line x1="56" y1="669" x2="704" y2="669" stroke="#444a58"/>
  <text x="57" y="695" class="tiny dim">O botão fica disponível após validar branch, caminho e identidade Git.</text>
  <rect x="510" y="677" width="77" height="31" rx="6" fill="#2d313d" stroke="#525866"/><text x="527" y="697" class="small">Cancelar</text>
  <rect x="596" y="677" width="109" height="31" rx="6" fill="#348d75"/><text x="608" y="697" class="small strong">Criar e abrir</text>
</svg>
